# Repository-level Ansible configuration.
# It is picked up automatically when ansible-* commands run from the repository root
# (local shell, GitHub Actions, Bitbucket Pipelines). scripts/run.sh always does that.

[defaults]
# REQUIRED by cp-ansible: the confluent.platform.common role asserts "Confirm Hash Merging Enabled".
# It is also the foundation of the layered override model
#   base -> tier -> topology -> environment -> site -> host
# Dictionaries are deep-merged across layers; scalars and lists are replaced.
hash_behaviour = merge

# Only the pinned collections installed by scripts/bootstrap.sh are used (collections/requirements.yml).
collections_path = ./collections
collections_scan_sys_path = False
collections_on_ansible_version_mismatch = error

# YAML formatted output from the built-in callback. Do not use "stdout_callback = yaml": that plugin
# (community.general.yaml) was removed in community.general 12.0.0 and makes every run fail.
stdout_callback = ansible.builtin.default
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks, confluent.platform.support_bundle_on_failure

interpreter_python = auto_silent
remote_tmp = ~/.ansible/tmp
forks = 20
retry_files_enabled = False

# Host keys stay verified (default). CI runners pass known_hosts through SSH_KNOWN_HOSTS (scripts/run.sh).
# Deprecation warnings stay visible: they announce breaking changes such as the removed yaml callback.

# One vault identity per environment; a value is only decrypted with the identity it was encrypted for.
vault_id_match = True

# There is intentionally NO default inventory: every run must pass -i environments/<environment>.

[inventory]
enable_plugins = yaml

[ssh_connection]
pipelining = True
timeout = 30
