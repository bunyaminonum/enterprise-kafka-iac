---
# cp-ansible is consumed as-is (no fork). Only its version is pinned here.
# Air-gapped: artifacts come from internal repositories; nothing is resolved from public Galaxy.
#
# Who installs this file:
#   command line    scripts/bootstrap.sh -> ./collections (ansible-galaxy --no-deps)
#   Tower           every project sync -> requirements_collections of the project, used before ./collections.
#                   The sync skips this file unless the project's organization has a Galaxy credential (any
#                   Galaxy/Automation Hub credential; the url entries below never contact it). It resolves
#                   dependencies: confluent.platform needs ansible.posix, which the url entry below satisfies.
#   EE image        execution-environment.yml bakes the same versions into the image (fallback).
#
# Upgrading cp-ansible is ONE pull request that changes:
#   1. the collection version below
#   2. iac_cp_ansible_version in shared/base/00-platform.yml   (preflight enforces that both match)
# The pull request pipeline renders the effective configuration of every environment before and
# after the change (scripts/config-diff.sh), so reviewers see exactly what the upgrade changes.
collections:
  # Option A (default): tarballs published to a Nexus raw repository.
  #   confluent-platform-8.3.2.tar.gz -> built from tag v8.3.2 with `ansible-galaxy collection build`
  #                                      or downloaded from Ansible Galaxy / Automation Hub
  #   8.3.2 is the first 8.3 release with rootless deployments (rootless_enabled, shared/base/00-platform.yml).
  - name: confluent.platform
    version: "8.3.1"
  # confluent.platform declares ansible.posix as a dependency. It is listed explicitly because
  # scripts/bootstrap.sh installs with --no-deps (no dependency resolution against public Galaxy).
  - name: ansible.posix
    version: "2.1.0"
  # NOT declared by confluent.platform, but required: playbooks/support_bundle.yml and
  # roles/common/tasks/fetch_logs.yml use the `archive` module, which ansible-core redirects to
  # community.general.archive. 12.x supports ansible-core >= 2.17.
  - name: community.general
    version: "12.6.5"

  # Option B: Bitbucket mirror of github.com/confluentinc/cp-ansible, pinned to the release tag.
  # - name: https://bitbucket.internal.net/scm/platform/cp-ansible.git
  #   type: git
  #   version: v8.3.2
