---
# =============================================================================
# FileConfigProvider secret files (shared/base/10-security.yml, "Passwords in generated files").
#
# Writes one file per component to iac_file_secrets_dir on every host, readable by the service user only,
# and sets the ${file:...} references for the rest of the ansible-playbook process (tasks/file_secrets.yml).
# site.yml imports this playbook before confluent.platform.all, so the files exist before any role writes
# a reference or starts a service.
#
#   scripts/run.sh <environment> file_secrets                                  # files only, no restart
#   scripts/run.sh <environment> file_secrets -e iac_file_secrets_verify=true  # + compare every value with
#                                                                                 the running configuration
# A running service does not notice a changed value: run the restart playbook after changing a secret.
# =============================================================================
- name: FileConfigProvider secret files
  hosts: kafka_controller:kafka_broker:schema_registry:kafka_connect:kafka_rest:control_center_next_gen
  # cp-ansible derives the component paths (kafka_broker.config_file, ...) from OS facts
  gather_facts: true
  gather_subset: [min]
  tasks:
    - name: Load cp-ansible variables
      ansible.builtin.import_role:
        name: confluent.platform.variables

    # Only the role DEFAULTS are needed (e.g. *_secrets_protection_file); the tasks never run
    # (same technique as render_config.yml).
    - name: Expose kafka_controller role defaults (tasks skipped)
      ansible.builtin.import_role:
        name: confluent.platform.kafka_controller
        tasks_from: health_check.yml
      when: false
      tags: [never]
    - name: Expose kafka_broker role defaults (tasks skipped)
      ansible.builtin.import_role:
        name: confluent.platform.kafka_broker
        tasks_from: health_check.yml
      when: false
      tags: [never]
    - name: Expose schema_registry role defaults (tasks skipped)
      ansible.builtin.import_role:
        name: confluent.platform.schema_registry
        tasks_from: health_check.yml
      when: false
      tags: [never]
    - name: Expose kafka_connect role defaults (tasks skipped)
      ansible.builtin.import_role:
        name: confluent.platform.kafka_connect
        tasks_from: health_check.yml
      when: false
      tags: [never]
    - name: Expose kafka_rest role defaults (tasks skipped)
      ansible.builtin.import_role:
        name: confluent.platform.kafka_rest
        tasks_from: health_check.yml
      when: false
      tags: [never]
    - name: Expose control_center_next_gen role defaults (tasks skipped)
      ansible.builtin.import_role:
        name: confluent.platform.control_center_next_gen
        tasks_from: health_check.yml
      when: false
      tags: [never]

    - name: Secret values and ${file:...} references
      ansible.builtin.import_tasks: tasks/file_secrets.yml
      when: iac_file_secrets_enabled | bool

    - name: Existing users
      ansible.builtin.getent:
        database: passwd
      when: iac_file_secrets_enabled | bool
      tags: [always]

    # On a new host the secret files are written before cp-ansible creates the service accounts.
    # Same attributes as the component roles, which skip existing users.
    - name: Service groups
      ansible.builtin.group:
        name: "{{ lookup('ansible.builtin.vars', item ~ '_group') }}"
      loop: "{{ iac_file_secrets_components | map(attribute='service') | unique | select('in', group_names) | list }}"
      when: iac_file_secrets_enabled | bool
      tags: [always]

    - name: Service users that do not exist yet
      ansible.builtin.user:
        name: "{{ lookup('ansible.builtin.vars', item ~ '_user') }}"
        comment: Confluent Platform
        system: true
        shell: "{{ user_login_shell }}"
        group: "{{ lookup('ansible.builtin.vars', item ~ '_group') }}"
      loop: "{{ iac_file_secrets_components | map(attribute='service') | unique | select('in', group_names) | list }}"
      when:
        - iac_file_secrets_enabled | bool
        - lookup('ansible.builtin.vars', item ~ '_user') not in ansible_facts.getent_passwd
      tags: [always]

    - name: Secret file directory
      ansible.builtin.file:
        path: "{{ iac_file_secrets_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0711"
      when: iac_file_secrets_enabled | bool
      tags: [always]

    # java.util.Properties format: backslashes and line breaks in a value are escaped. The characters are
    # task variables because Ansible escapes backslashes inside inline Jinja expressions once more.
    - name: Secret files, readable by the service user only
      ansible.builtin.copy:
        dest: "{{ iac_file_secrets_dir }}/{{ item.name }}.properties"
        content: |
          # {{ item.name }} | managed by playbooks/file_secrets.yml | read through FileConfigProvider
          {% for key, value in iac_file_secrets[item.name]['values'] | dictsort %}
          {{ key }}={{ value | replace(iac_bs, iac_bs ~ iac_bs) | replace(iac_nl, iac_bs ~ 'n') | replace(iac_cr, iac_bs ~ 'r') }}
          {% endfor %}
        owner: "{{ iac_file_secrets[item.name].owner }}"
        group: "{{ iac_file_secrets[item.name].group }}"
        mode: "0400"
      vars:
        iac_bs: "\\"
        iac_nl: "\n"
        iac_cr: "\r"
      loop: "{{ iac_file_secrets_components | selectattr('service', 'in', group_names) | list }}"
      loop_control:
        label: "{{ item.name }}"
      when: iac_file_secrets_enabled | bool
      no_log: true
      diff: false
      tags: [always]

    # Migration from Secret Protection: proves before any restart that every value in the new files equals
    # the value the service runs with today (decrypted ${securepass:...} or plain text). Key names only.
    - name: Compare the secret files with the running configuration
      ansible.builtin.script:
        cmd: >-
          compare_file_secrets.py --cli {{ confluent_cli_path }}
          {% for item in iac_file_secrets_components | selectattr('service', 'in', group_names) %}
          --component {{ item.name }},{{ lookup('ansible.builtin.vars', item.service)[item.config] }},{{
          lookup('ansible.builtin.vars', item.name ~ '_secrets_protection_file') }},{{
          lookup('ansible.builtin.vars', item.service).systemd_override }},{{
          iac_file_secrets_dir }}/{{ item.name }}.properties
          {% endfor %}
        executable: "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      register: iac_file_secrets_compare
      changed_when: false
      failed_when: false
      when:
        - iac_file_secrets_enabled | bool
        - iac_file_secrets_verify | default(false) | bool
      tags: [always]

    - name: Comparison result
      ansible.builtin.debug:
        var: iac_file_secrets_compare.stdout_lines
      when: iac_file_secrets_compare is not skipped
      tags: [always]

    - name: Every value equals the running configuration
      ansible.builtin.assert:
        that: iac_file_secrets_compare.rc == 0
        fail_msg: "{{ iac_file_secrets_compare.stderr | default('') }} - see the comparison result above"
        quiet: true
      when: iac_file_secrets_compare is not skipped
      tags: [always]
