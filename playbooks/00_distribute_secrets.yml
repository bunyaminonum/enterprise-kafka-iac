---
- name: Securely Distribute FileConfigProvider Secret File
  hosts: kafka_broker,kafka_connect,schema_registry
  become: true
  tasks:
    - name: Ensure Directory /var/ssl/private Exists
      ansible.builtin.file:
        path: /var/ssl/private
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy security.properties with Restricted Permissions
      ansible.builtin.copy:
        dest: /var/ssl/private/security.properties
        owner: root
        group: root
        mode: '0600'
        content: |
          # FileConfigProvider Runtime Store
          ldap_bind_password={{ vault_ldap_bind_password }}
          kafka_connect_ldap_password={{ vault_kafka_connect_ldap_password }}
          kafka_broker_ldap_password={{ vault_kafka_broker_ldap_password }}
          schema_registry_ldap_password={{ vault_schema_registry_ldap_password }}
