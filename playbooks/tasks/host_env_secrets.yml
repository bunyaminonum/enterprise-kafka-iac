---
# Secrets from the environment of the automation account on the managed hosts (e.g. exported in its ~/.bashrc)
# instead of the environment of the control node. Active when iac_secrets_from_host_env is true.
# Runs WITHOUT privilege escalation: sudo resets the environment, so root does not see these variables.
# set_fact wins over the lookups of shared/base/15-secrets.yml for the rest of this ansible-playbook process.
- name: Read the IAC_SECRET_* variables of the automation account on this host
  ansible.builtin.command: env
  register: iac_host_env
  changed_when: false
  vars:
    ansible_become: false     # the inventory sets ansible_become: true; sudo would reset the environment
  no_log: true

- name: IAC_SECRET_* variables of this host become vault_* variables
  ansible.builtin.set_fact:
    "{{ 'vault_' ~ (item.split('=', 1)[0] | regex_replace('^IAC_SECRET_', '') | lower) }}": "{{ item.split('=', 1)[1] }}"   # noqa: var-naming[no-jinja]
  loop: "{{ iac_host_env.stdout_lines | select('match', '^IAC_SECRET_[A-Z0-9_]+=') | list }}"
  loop_control:
    label: "{{ item.split('=', 1)[0] }}"
  no_log: true

- name: Every registered secret is set on this host and equal on all hosts
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item, default='') | string | length > 0
      - lookup('ansible.builtin.vars', item, default='') == hostvars[ansible_play_hosts_all[0]][item] | default('')
    fail_msg: >-
      {{ inventory_hostname }}: IAC_SECRET_{{ item | regex_replace('^vault_', '') | upper }} is missing in the
      environment of {{ ansible_user | default('the automation account') }} or differs from {{ ansible_play_hosts_all[0] }}
    quiet: true
  loop: "{{ iac_required_secrets | dict2items | selectattr('value') | map(attribute='key') | list }}"
  loop_control:
    label: "{{ item }}"