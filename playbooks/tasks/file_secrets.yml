---
# FileConfigProvider references for every password-like value cp-ansible writes into a properties file.
#
# For every component on the host, the password-like keys of its properties (iac_file_secrets_key_patterns,
# the selection cp-ansible's Secret Protection uses) are
#   1. collected with their values in iac_file_secrets (written to the hosts by playbooks/file_secrets.yml),
#   2. replaced by ${file:<secret file>:<key>} references through the component's *_custom_properties.
# set_fact has a higher precedence than the inventory, so every cp-ansible role that runs later IN THE SAME
# ansible-playbook process templates the references instead of the values (same technique as
# static_placeholders.yml). The calling play loads confluent.platform.variables and exposes the component
# role defaults (see playbooks/file_secrets.yml).
- name: FileConfigProvider and Secret Protection are not enabled together
  ansible.builtin.assert:
    that: not (secrets_protection_enabled | bool)
    fail_msg: iac_file_secrets_enabled and secrets_protection_enabled cannot both be true
    quiet: true
  tags: [always]

- name: Properties files that carry passwords
  ansible.builtin.set_fact:
    # properties: variable cp-ansible templates the file from; custom: variable that overrides its keys
    # config: key of the file path in the component dictionary (kafka_broker.config_file, ...)
    # client_providers: REST Proxy passes client.* to its Kafka clients, which need their own provider
    iac_file_secrets_components:
      - {name: kafka_controller, service: kafka_controller, config: config_file,
         properties: kafka_controller_final_properties, custom: kafka_controller_custom_properties}
      - {name: kafka_controller_client, service: kafka_controller, config: client_config_file,
         properties: kafka_controller_client_properties, custom: kafka_controller_custom_client_properties}
      - {name: kafka_broker, service: kafka_broker, config: config_file,
         properties: kafka_broker_final_properties, custom: kafka_broker_custom_properties}
      - {name: kafka_broker_client, service: kafka_broker, config: client_config_file,
         properties: kafka_broker_client_properties, custom: kafka_broker_custom_client_properties}
      - {name: schema_registry, service: schema_registry, config: config_file,
         properties: schema_registry_final_properties, custom: schema_registry_custom_properties}
      - {name: kafka_connect, service: kafka_connect, config: config_file,
         properties: kafka_connect_final_properties, custom: kafka_connect_custom_properties}
      - {name: kafka_rest, service: kafka_rest, config: config_file, client_providers: true,
         properties: kafka_rest_final_properties, custom: kafka_rest_custom_properties}
      - {name: control_center_next_gen, service: control_center_next_gen, config: config_file,
         properties: control_center_next_gen_final_properties, custom: control_center_next_gen_custom_properties}
  tags: [always]

# Skipped for a component that was already collected in this process: its properties carry references by now.
- name: Collect the password-like values of every component
  ansible.builtin.set_fact:
    iac_file_secrets: >-
      {{ iac_file_secrets | default({}) | combine({item.name: {
           'owner': lookup('ansible.builtin.vars', item.service ~ '_user'),
           'group': lookup('ansible.builtin.vars', item.service ~ '_group'),
           'providers': iac_props.get('config.providers', '') | string,
           'client_providers': iac_props.get('client.config.providers', '') | string,
           'values': dict(iac_pairs)}}) }}
  vars:
    iac_props: "{{ lookup('ansible.builtin.vars', item.properties) }}"
    iac_keys: "{{ iac_props.keys() | select('match', iac_file_secrets_key_patterns | join('|')) | list }}"
    iac_pairs: "{{ iac_keys | zip(iac_keys | map('extract', iac_props) | map('string')) | rejectattr('1', 'match', '[$][{]') | list }}"
  loop: "{{ iac_file_secrets_components | selectattr('service', 'in', group_names) | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in (iac_file_secrets | default({}))
  no_log: true
  tags: [always]

- name: Replace the values with ${file:...} references
  ansible.builtin.set_fact:
    "{{ item.custom }}": >-  # noqa: var-naming[no-jinja]
      {{ lookup('ansible.builtin.vars', item.custom)
         | combine(iac_refs, iac_providers, iac_client_providers if item.client_providers | default(false) else {}) }}
  vars:
    iac_entry: "{{ iac_file_secrets[item.name] }}"
    iac_keys: "{{ iac_entry['values'] | list }}"
    iac_refs: "{{ dict(iac_keys | zip(iac_keys | map('regex_replace', '^(.*)$', '${file:' ~ iac_file_secrets_dir ~ '/' ~ item.name ~ '.properties:\\1}'))) }}"
    iac_providers:
      config.providers: "{{ (iac_entry.providers.split(',') | map('trim') | reject('equalto', '') | list + ['file']) | unique | join(',') }}"
      config.providers.file.class: org.apache.kafka.common.config.provider.FileConfigProvider
      config.providers.file.param.allowed.paths: "{{ iac_file_secrets_dir }}"
    iac_client_providers:
      client.config.providers: "{{ (iac_entry.client_providers.split(',') | map('trim') | reject('equalto', '') | list + ['file']) | unique | join(',') }}"
      client.config.providers.file.class: org.apache.kafka.common.config.provider.FileConfigProvider
      client.config.providers.file.param.allowed.paths: "{{ iac_file_secrets_dir }}"
  loop: "{{ iac_file_secrets_components | selectattr('service', 'in', group_names) | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: iac_file_secrets[item.name]['values'] | length > 0
  tags: [always]

- name: No password-like value is left in plain text
  ansible.builtin.assert:
    that: iac_left | length == 0
    fail_msg: "{{ item.name }} still carries plain text values for: {{ iac_left | join(', ') }}"
    quiet: true
  vars:
    iac_props: "{{ lookup('ansible.builtin.vars', item.properties) }}"
    iac_keys: "{{ iac_props.keys() | select('match', iac_file_secrets_key_patterns | join('|')) | list }}"
    iac_left: "{{ iac_keys | zip(iac_keys | map('extract', iac_props) | map('string')) | rejectattr('1', 'match', '[$][{]') | map(attribute='0') | list }}"
  loop: "{{ iac_file_secrets_components | selectattr('service', 'in', group_names) | list }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [always]

- name: Values moved to secret files per component
  ansible.builtin.debug:
    msg: "{{ iac_names | zip(iac_names | map('extract', iac_file_secrets) | map(attribute='values') | map('length')) | map('join', ': ') | list }}"
  vars:
    iac_names: "{{ iac_file_secrets | default({}) | list | sort }}"
  tags: [always]
