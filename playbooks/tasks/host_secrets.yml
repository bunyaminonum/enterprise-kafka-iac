---
# Secrets from a root-only env file on the managed hosts instead of the environment of the control node.
# Active when iac_host_secrets_file is set (environments/<environment>/group_vars/all/20-components.yml).
# Lines: IAC_SECRET_<NAME>=<value>, optionally with export and quotes (same format as ~/.secrets/<environment>.env).
# set_fact wins over the lookups of shared/base/15-secrets.yml for the rest of this ansible-playbook process.
- name: Read the secret file of this host
  ansible.builtin.slurp:
    src: "{{ iac_host_secrets_file }}"
  register: iac_host_secrets_raw
  become: true
  no_log: true

- name: Secrets of the host file become vault_* variables
  ansible.builtin.set_fact:
    "{{ 'vault_' ~ (iac_name | regex_replace('^IAC_SECRET_', '') | lower) }}": "{{ iac_value }}"   # noqa: var-naming[no-jinja]
  vars:
    iac_name: "{{ item.split('=', 1)[0] | regex_replace('^export\\s+', '') | trim }}"
    iac_value: >-
      {{ item.split('=', 1)[1] | trim | regex_replace("^'(.*)'$", '\1') | regex_replace('^"(.*)"$', '\1') }}
  loop: "{{ (iac_host_secrets_raw.content | b64decode).splitlines() | select('match', '^\\s*(export\\s+)?IAC_SECRET_[A-Z0-9_]+=') | list }}"
  loop_control:
    label: "{{ item.split('=', 1)[0] }}"
  no_log: true
