---
# Secret references for every password-like value cp-ansible writes into a properties file.
#
# For every component on the host, the password-like keys of its properties (iac_config_secrets_key_patterns,
# the selection cp-ansible's Secret Protection uses) are
#   1. collected with their values in iac_config_secrets (written to the hosts by playbooks/config_secrets.yml),
#   2. replaced by references through the component's *_custom_properties:
#        service configuration, provider env   ${env:CP_SECRET_<KEY>}  EnvVarConfigProvider, the service reads a
#                                              systemd EnvironmentFile (root, 0600)
#        service configuration, provider file  ${file:<file>:<key>}    FileConfigProvider (service user, 0400)
#        tool configuration (client.properties) ${file:<file>:<key>}   always: the kafka-* CLI tools and the
#                                              cp-ansible health checks read it without the service environment
# set_fact has a higher precedence than the inventory, so every cp-ansible role that runs later IN THE SAME
# ansible-playbook process templates the references instead of the values (same technique as
# static_placeholders.yml). The calling play loads confluent.platform.variables and exposes the component
# role defaults (see playbooks/config_secrets.yml).
- name: Config secrets and Secret Protection are not enabled together
  ansible.builtin.assert:
    that:
      - not (secrets_protection_enabled | bool)
      - iac_config_secrets_provider in ['env', 'file']
    fail_msg: >-
      iac_config_secrets_enabled and secrets_protection_enabled cannot both be true, and
      iac_config_secrets_provider must be env or file (is '{{ iac_config_secrets_provider }}')
    quiet: true
  tags: [always]

- name: Properties files that carry passwords
  ansible.builtin.set_fact:
    # properties: variable cp-ansible templates the file from; custom: variable that overrides its keys
    # config: key of the file path in the component dictionary (kafka_broker.config_file, ...)
    # tool: read by CLI tools and health checks, not by the service (always provider file)
    # client_providers: REST Proxy passes client.* to its Kafka clients, which need their own provider
    iac_config_secrets_components:
      - {name: kafka_controller, service: kafka_controller, config: config_file,
         properties: kafka_controller_final_properties, custom: kafka_controller_custom_properties}
      - {name: kafka_controller_client, service: kafka_controller, config: client_config_file, tool: true,
         properties: kafka_controller_client_properties, custom: kafka_controller_custom_client_properties}
      - {name: kafka_broker, service: kafka_broker, config: config_file,
         properties: kafka_broker_final_properties, custom: kafka_broker_custom_properties}
      - {name: kafka_broker_client, service: kafka_broker, config: client_config_file, tool: true,
         properties: kafka_broker_client_properties, custom: kafka_broker_custom_client_properties}
      - {name: schema_registry, service: schema_registry, config: config_file,
         properties: schema_registry_final_properties, custom: schema_registry_custom_properties}
      - {name: kafka_connect, service: kafka_connect, config: config_file,
         properties: kafka_connect_final_properties, custom: kafka_connect_custom_properties}
      - {name: kafka_rest, service: kafka_rest, config: config_file, client_providers: true,
         properties: kafka_rest_final_properties, custom: kafka_rest_custom_properties}
      - {name: control_center_next_gen, service: control_center_next_gen, config: config_file,
         properties: control_center_next_gen_final_properties, custom: control_center_next_gen_custom_properties}
  tags: [always]

# Skipped for a component that was already collected in this process: its properties carry references by now.
- name: Collect the password-like values of every component
  ansible.builtin.set_fact:
    iac_config_secrets: >-
      {{ iac_config_secrets | default({}) | combine({item.name: {
           'mode': 'file' if item.tool | default(false) else iac_config_secrets_provider,
           'owner': lookup('ansible.builtin.vars', item.service ~ '_user'),
           'group': lookup('ansible.builtin.vars', item.service ~ '_group'),
           'providers': iac_props.get('config.providers', '') | string,
           'client_providers': iac_props.get('client.config.providers', '') | string,
           'values': dict(iac_pairs),
           'env_names': dict(iac_pairs | map(attribute='0') | zip(iac_pairs | map(attribute='0') | map('upper')
                             | map('regex_replace', '[^A-Z0-9]', '_')
                             | map('regex_replace', '^', iac_config_secrets_env_prefix)))}}) }}
  vars:
    iac_props: "{{ lookup('ansible.builtin.vars', item.properties) }}"
    iac_keys: "{{ iac_props.keys() | select('match', iac_config_secrets_key_patterns | join('|')) | list }}"
    iac_pairs: "{{ iac_keys | zip(iac_keys | map('extract', iac_props) | map('string')) | rejectattr('1', 'match', '[$][{]') | list }}"
  loop: "{{ iac_config_secrets_components | selectattr('service', 'in', group_names) | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in (iac_config_secrets | default({}))
  no_log: true
  tags: [always]

- name: Environment variable names are unique per service
  ansible.builtin.assert:
    that: iac_names | length == iac_names | unique | length
    fail_msg: "{{ item.name }}: two keys map to the same environment variable name: {{ iac_names | sort }}"
    quiet: true
  vars:
    iac_names: "{{ iac_config_secrets[item.name].env_names.values() | list }}"
  loop: "{{ iac_config_secrets_components | selectattr('service', 'in', group_names) | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: iac_config_secrets[item.name].mode == 'env'
  tags: [always]

- name: Replace the values with references
  ansible.builtin.set_fact:
    "{{ item.custom }}": >-  # noqa: var-naming[no-jinja]
      {{ lookup('ansible.builtin.vars', item.custom)
         | combine(iac_refs, iac_providers, iac_client_providers if item.client_providers | default(false) else {}) }}
  vars:
    iac_entry: "{{ iac_config_secrets[item.name] }}"
    iac_keys: "{{ iac_entry['values'] | list }}"
    iac_provider: "{{ iac_entry.mode }}"
    iac_refs: >-
      {{ dict(iac_keys | zip(iac_keys | map('extract', iac_entry.env_names)
                             | map('regex_replace', '^', '${env:') | map('regex_replace', '$', '}')))
         if iac_provider == 'env' else
         dict(iac_keys | zip(iac_keys | map('regex_replace', '^', '${file:' ~ iac_config_secrets_dir ~ '/' ~ item.name ~ '.properties:')
                             | map('regex_replace', '$', '}'))) }}
    iac_provider_params: >-
      {{ {'param.allowlist.pattern': '^' ~ iac_config_secrets_env_prefix ~ '.*'} if iac_provider == 'env'
         else {'param.allowed.paths': iac_config_secrets_dir} }}
    iac_provider_class: >-
      {{ 'org.apache.kafka.common.config.provider.EnvVarConfigProvider' if iac_provider == 'env'
         else 'org.apache.kafka.common.config.provider.FileConfigProvider' }}
    iac_providers: >-
      {{ {'config.providers': (iac_entry.providers.split(',') | map('trim') | reject('equalto', '') | list + [iac_provider]) | unique | join(','),
          'config.providers.' ~ iac_provider ~ '.class': iac_provider_class}
         | combine(dict(iac_provider_params | dict2items | map(attribute='key') | map('regex_replace', '^', 'config.providers.' ~ iac_provider ~ '.')
                        | zip(iac_provider_params.values()))) }}
    iac_client_providers: >-
      {{ {'client.config.providers': (iac_entry.client_providers.split(',') | map('trim') | reject('equalto', '') | list + [iac_provider]) | unique | join(','),
          'client.config.providers.' ~ iac_provider ~ '.class': iac_provider_class}
         | combine(dict(iac_provider_params | dict2items | map(attribute='key') | map('regex_replace', '^', 'client.config.providers.' ~ iac_provider ~ '.')
                        | zip(iac_provider_params.values()))) }}
  loop: "{{ iac_config_secrets_components | selectattr('service', 'in', group_names) | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: iac_config_secrets[item.name]['values'] | length > 0
  tags: [always]

# systemd reads the EnvironmentFile as root before it starts the service; the file never appears in the unit
# environment (systemctl show -p Environment), only its path does.
- name: Services read their secrets from their environment file (provider env)
  ansible.builtin.set_fact:
    "{{ item.service }}_service_overrides": >-  # noqa: var-naming[no-jinja]
      {{ lookup('ansible.builtin.vars', item.service ~ '_service_overrides')
         | combine({'EnvironmentFile': iac_config_secrets_dir ~ '/' ~ item.name ~ '.env'}) }}
  loop: "{{ iac_config_secrets_components | selectattr('service', 'in', group_names) | rejectattr('tool', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - iac_config_secrets[item.name].mode == 'env'
    - iac_config_secrets[item.name]['values'] | length > 0
  tags: [always]

- name: No password-like value is left in plain text
  ansible.builtin.assert:
    that: iac_left | length == 0
    fail_msg: "{{ item.name }} still carries plain text values for: {{ iac_left | join(', ') }}"
    quiet: true
  vars:
    iac_props: "{{ lookup('ansible.builtin.vars', item.properties) }}"
    iac_keys: "{{ iac_props.keys() | select('match', iac_config_secrets_key_patterns | join('|')) | list }}"
    iac_left: "{{ iac_keys | zip(iac_keys | map('extract', iac_props) | map('string')) | rejectattr('1', 'match', '[$][{]') | map(attribute='0') | list }}"
  loop: "{{ iac_config_secrets_components | selectattr('service', 'in', group_names) | list }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [always]

- name: Values moved out of the properties files per component
  ansible.builtin.debug:
    msg: "{{ iac_names | zip(iac_names | map('extract', iac_config_secrets) | map(attribute='mode'),
                             iac_names | map('extract', iac_config_secrets) | map(attribute='values') | map('length'))
             | map('join', ' ') | list }}"
  vars:
    iac_names: "{{ iac_config_secrets | default({}) | list | sort }}"
  tags: [always]
