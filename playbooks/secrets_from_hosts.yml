---
# =============================================================================
# Secrets from the login environment of the automation account on the managed hosts (iac_secrets_source: host).
#
# The platform team defines every IAC_SECRET_* variable (names: secrets.env.example) on EVERY host of the
# environment, in ~/.bash_profile of the account Ansible connects with (ansible_user):
#   export IAC_SECRET_<NAME>=<value>
# lookup('env') in shared/base/15-secrets.yml only sees the environment of the ansible-playbook process (Tower: the
# job container), never the hosts. This play reads the values on the hosts through a login shell, as the SSH user
# (not root: sudo starts with a clean environment), and sets the vault_* variables for the rest of the run
# (set_fact wins over the inventory). Values never appear in the output (no_log).
# Before anything is written it checks that every registered secret is set on every host, that the SCRAM and PLAIN
# passwords are letters and digits, and that all hosts carry the same values (only hashes are compared).
#
# Imported at the top of preflight.yml (every playbook that needs secrets imports it) and config_secrets.yml.
# Verify on a host without printing any value:   bash -lc 'printenv | grep -c ^IAC_SECRET_'
# =============================================================================
- name: Secrets from the hosts (iac_secrets_source host)
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tags: [always]
  tasks:
    - name: Login environment of the automation account
      when:
        - iac_secrets_source | default('controller') == 'host'
        - iac_host_secrets_loaded is not defined
      vars:
        # task variables win over ansible_become: true of shared/base/00-platform.yml
        ansible_become: false
      block:
        - name: Read the IAC_SECRET_* variables of a login shell
          ansible.builtin.shell: bash -lc printenv | grep '^IAC_SECRET_' || true
          register: iac_host_env
          changed_when: false
          check_mode: false
          no_log: true

        - name: Parse the values
          ansible.builtin.set_fact:
            iac_host_secrets: "{{ dict(iac_host_env.stdout | regex_findall('(?m)^IAC_SECRET_([A-Z0-9_]+)=(.*)$')) }}"
          no_log: true

        - name: Every registered secret is set on this host
          ansible.builtin.assert:
            that: iac_missing | length == 0
            fail_msg: >-
              {{ inventory_hostname }}: {{ iac_missing | map('regex_replace', '^', 'IAC_SECRET_') | join(', ') }}
              missing or empty in the login environment of '{{ ansible_user | default('the SSH user') }}'
              (export IAC_SECRET_<NAME>=<value> in ~/.bash_profile, names: secrets.env.example)
            quiet: true
          vars:
            iac_required: >-
              {{ iac_required_secrets | dict2items | selectattr('value') | map(attribute='key')
                 | map('regex_replace', '^vault_', '') | map('upper') | list }}
            iac_missing: >-
              {{ iac_required | reject('in', iac_host_secrets | dict2items | selectattr('value') | map(attribute='key') | list)
                 | list }}

        - name: SCRAM and PLAIN passwords are letters and digits (they are written into JAAS configurations)
          ansible.builtin.assert:
            that: iac_host_secrets[item] | default('') is match('^[A-Za-z0-9]{16,}$')
            fail_msg: "{{ inventory_hostname }}: IAC_SECRET_{{ item }} needs at least 16 letters and digits and nothing else"
            quiet: true
          loop: [KAFKA_BROKER_SCRAM_PASSWORD, KAFKA_CONTROLLER_PLAIN_PASSWORD]

        - name: Fingerprint of the values on this host
          ansible.builtin.set_fact:
            iac_host_secrets_fingerprint: "{{ iac_host_secrets | dictsort | to_json | hash('sha256') }}"

        - name: All hosts carry the same values
          ansible.builtin.assert:
            that: ansible_play_hosts | map('extract', hostvars, 'iac_host_secrets_fingerprint') | unique | length == 1
            fail_msg: >-
              The IAC_SECRET_* values differ between the hosts (first 8 characters of their fingerprints):
              {% for h in ansible_play_hosts %}{{ h }}={{ hostvars[h].iac_host_secrets_fingerprint[:8] }} {% endfor %}
            quiet: true
          run_once: true

        - name: vault_* variables from the hosts (override the lookups of shared/base/15-secrets.yml)
          ansible.builtin.set_fact:
            "vault_{{ item.key | lower }}": "{{ item.value }}"  # noqa: var-naming[no-jinja]
          loop: "{{ iac_host_secrets | dict2items }}"
          loop_control:
            label: "IAC_SECRET_{{ item.key }}"
          no_log: true

        - name: Secrets are loaded for this run
          ansible.builtin.set_fact:
            iac_host_secrets_loaded: true
