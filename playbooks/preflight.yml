---
# =============================================================================
# Preflight: guard rails that run before any cp-ansible play. Nothing here connects to managed hosts.
#
# Modes
#   deploy (default)                  all checks, including secrets and the confirmation
#                                     of protected environments (-e confirm_env=<environment>)
#   -e iac_static_validation=true     pull requests / CI: no vault password needed, secrets are
#                                     replaced by placeholders, no confirmation required
# Wrappers may pass iac_require_confirmation=false for read-only operations (health checks).
# Every changing playbook imports this one, so a Tower job template runs it without any wrapper script.
# =============================================================================



- name: Preflight | guard rails
  hosts: all
  gather_facts: false
  become: false
  any_errors_fatal: true
  tags: [always]
  tasks:
    - name: debug
      ansible.builtin.debug:
        var: iac_static_validation
    - name: Secrets from the file on the hosts (iac_host_secrets_file)
      ansible.builtin.import_tasks: tasks/host_secrets.yml
      when:
        - iac_host_secrets_file is defined
        - not (iac_static_validation | default(false) | bool)
    - name: Replace registered secrets with placeholders (static validation)
      ansible.builtin.import_tasks: tasks/static_placeholders.yml
      when: iac_static_validation | default(false) | bool

    # --------------------------------------------------- identity, versions, secrets
    - name: Checks that do not need cp-ansible variables (once, on the control node)
      delegate_to: localhost
      run_once: true
      block:
        - name: Hash merging is enabled (cp-ansible requirement, basis of the layering model)
          ansible.builtin.assert:
            that: lookup('ansible.builtin.config', 'DEFAULT_HASH_BEHAVIOUR') == 'merge'
            fail_msg: >-
              hash_behaviour must be 'merge'. Run from the repository root (ansible.cfg) and do not set ANSIBLE_HASH_BEHAVIOUR.
              Tower: ansible.cfg was ignored; run the job template with the execution environment of
              execution-environment.yml, which sets ANSIBLE_CONFIG=/runner/project/ansible.cfg.
            quiet: true

        - name: Installed confluent.platform collection matches iac_cp_ansible_version
          ansible.builtin.assert:
            that:
              - iac_manifest | length > 0
              - iac_installed_version == iac_cp_ansible_version
            fail_msg: >-
              Pinned version {{ iac_cp_ansible_version }} but installed
              {{ iac_installed_version | default('nothing', true) }} ({{ iac_manifest | default('no MANIFEST.json', true) }}).
              Run scripts/bootstrap.sh and keep collections/requirements.yml in sync. Tower: sync the project again
              (its organization needs a Galaxy credential, otherwise the sync skips collections/requirements.yml).
            quiet: true
          vars:
            iac_manifest: >-
              {{ lookup('ansible.builtin.first_found',
                        lookup('ansible.builtin.config', 'COLLECTIONS_PATHS')
                        | map('regex_replace', '/+$', '')
                        | product(['/ansible_collections/confluent/platform/MANIFEST.json']) | map('join') | list,
                        skip=true) }}
            iac_installed_version: >-
              {{ (lookup('ansible.builtin.file', iac_manifest) | from_json).collection_info.version
                 if iac_manifest | length > 0 else '' }}

        - name: Protected environments require an explicit confirmation
          ansible.builtin.assert:
            that: (confirm_env | default('')) == iac_env
            fail_msg: >-
              '{{ iac_env }}' is a protected environment. Re-run with -e confirm_env={{ iac_env }}
              (CI: confirmation input, Tower: survey question confirm_env).
            quiet: true
          when:
            - iac_env in iac_protected_envs
            - iac_require_confirmation | default(true) | bool
            - not (iac_static_validation | default(false) | bool)

        - name: Co-located KRaft mode is limited to non-production environments
          ansible.builtin.assert:
            that:
              - iac_tier != 'prod'
              - iac_env not in iac_protected_envs
            fail_msg: "iac_kraft_colocated is a mode for small non-production environments; refused for '{{ iac_env }}'."
            quiet: true
          when: iac_kraft_colocated | default(false) | bool

        - name: Every inventory host belongs to the environment group
          ansible.builtin.assert:
            that:
              - ('env_' ~ iac_env) in groups
              - groups['all'] | difference(groups['env_' ~ iac_env]) | length == 0
            fail_msg: "All hosts of environments/{{ iac_env }} must be children of the group env_{{ iac_env }}."
            quiet: true

        # The layers of group_vars/all (base, tier, topology, environment) are merged key by key only while the
        # inventory is LOADED with hash_behaviour merge. Tower loads it once, at the inventory sync, and stores the
        # result; an inventory synced without ansible.cfg keeps only the last layer of every dictionary.
        - name: Inventory layers are merged key by key
          ansible.builtin.assert:
            that:
              - "'ldap.java.naming.provider.url' in kafka_broker_custom_properties"
              - "'log.dirs' in kafka_broker_custom_properties"
            fail_msg: >-
              kafka_broker_custom_properties lost the keys of shared/base/10-security.yml or 31-kafka-broker.yml:
              the inventory was loaded without hash_behaviour merge. Tower: give the inventory source the execution
              environment of execution-environment.yml or the source variable ANSIBLE_CONFIG: /runner/project/ansible.cfg,
              and sync the inventory again.
            quiet: true

#        - name: Registered secrets are set (deploy mode)
#          ansible.builtin.assert:
#            that:
#              - lookup('ansible.builtin.vars', item, default='') | string | length > 0
#              - lookup('ansible.builtin.vars', item, default='') | string != 'CHANGE_ME'
#            fail_msg: >-
#              {{ item }} is empty or CHANGE_ME: export IAC_SECRET_{{ item | regex_replace('^vault_', '') | upper }}
#              for '{{ iac_env }}' (secrets.env.example, shared/base/15-secrets.yml; Tower: credential "Kafka IaC")
#            quiet: true
#          loop: "{{ iac_required_secrets | dict2items | selectattr('value') | map(attribute='key') | list }}"
#          when: not (iac_static_validation | default(false) | bool)

        - name: Secret Protection keeps its master key and has its security file (deploy mode)
          ansible.builtin.assert:
            that:
              - not (regenerate_masterkey | bool)
              - secrets_protection_security_file is file
            fail_msg: >-
              regenerate_masterkey must stay false and {{ secrets_protection_security_file }} must exist on the
              control node. Materialise the security.properties of '{{ iac_env }}' into IAC_SECRETS_DIR.
            quiet: true
          when:
            - secrets_protection_enabled | bool
            - not (iac_static_validation | default(false) | bool)

        - name: MDS super user password is not the collection default
          ansible.builtin.assert:
            that: mds_super_user_password | string != 'password'
            quiet: true
          when: not (iac_static_validation | default(false) | bool)

#        - name: SCRAM and PLAIN passwords contain letters and digits only (deploy mode)
#          ansible.builtin.assert:
#            that: lookup('ansible.builtin.vars', item) | string is match('^[A-Za-z0-9]{16,}$')
#            fail_msg: >-
#              {{ item }} (IAC_SECRET_{{ item | regex_replace('^vault_', '') | upper }}) must have at least 16 letters
#              and digits and nothing else: it is written into JAAS configurations and kafka-configs arguments
#              (e.g. openssl rand -hex 24)
#            quiet: true
#          loop:
#            - vault_kafka_broker_scram_password
#            - vault_kafka_controller_plain_password
#          when: not (iac_static_validation | default(false) | bool)

#        - name: Rootless deployment settings are consistent
#          ansible.builtin.assert:
#            that:
#              - installation_method == 'archive'
#              - deployment_user | length > 0
#              - deployment_group | length > 0
#              - rootless_deployment_path is match('^/.+[^/]$')
#              - iac_cp_ansible_version is version('8.3.2', '>=')
#            fail_msg: >-
#              rootless_enabled needs installation_method archive, deployment_user, deployment_group, an absolute
#              rootless_deployment_path without trailing slash and cp-ansible >= 8.3.2
#            quiet: true
#          when: rootless_enabled | bool

    - name: Load cp-ansible variables (defaults and derived values used by the checks below)
      ansible.builtin.import_role:
        name: confluent.platform.variables

    # -------------------------------------------------------------- per-host checks
    # Identity through the env_<environment> group of hosts.yml, not through inventory_dir: Tower hands the job a
    # generated inventory outside the project (/runner/inventory).
    - name: Host belongs to this environment and all layers are loaded
      ansible.builtin.assert:
        that:
          - iac_env is defined
          - ('env_' ~ iac_env) in group_names
          - iac_tier is defined
          - iac_topology is defined
        fail_msg: >-
          Inventory/identity mismatch (hosts.yml group env_<environment> against iac_env of 10-env.yml) or a missing
          layer symlink (00-base, 05-tier, 06-topology). On Windows checkouts enable git symlinks (core.symlinks=true).
        quiet: true

#    - name: Rootless - Ansible connects as the deploy user and never escalates
#      ansible.builtin.assert:
#        that:
#          - ansible_user | default('') == deployment_user
#          - not (ansible_become | default(false) | bool)
#        fail_msg: >-
#          {{ inventory_hostname }}: a rootless deployment runs as the deploy user '{{ deployment_user }}'
#          (ansible_user is '{{ ansible_user | default('') }}', ansible_become is {{ ansible_become | default(false) }}).
#          Do not override ansible_user or ansible_become per host.
#        quiet: true
#      when: rootless_enabled | bool

    - name: KRaft nodes pin node_id
      ansible.builtin.assert:
        that: node_id is defined and (node_id | string) is match('^[0-9]+$')
        fail_msg: "{{ inventory_hostname }} must define an integer node_id in hosts.yml"
        quiet: true
      when:
        - inventory_hostname in groups['kafka_controller'] + groups['kafka_broker']
        - not (iac_kraft_colocated | default(false) | bool)

    - name: Co-located KRaft nodes leave node_id unset
      ansible.builtin.assert:
        that: node_id is not defined
        fail_msg: >-
          {{ inventory_hostname }}: with iac_kraft_colocated the controller and the broker of one host both read
          node_id. Leave it unset: controllers get 9991 + host index, brokers 1 + host index.
        quiet: true
      when:
        - inventory_hostname in groups['kafka_controller'] + groups['kafka_broker']
        - iac_kraft_colocated | default(false) | bool

    - name: Site membership matches the topology
      ansible.builtin.assert:
        that: >-
          (group_names | select('match', '^site_') | list | length)
          == (1 if iac_topology == 'stretched-2dc' else 0)
        fail_msg: >-
          {{ inventory_hostname }}: stretched-2dc requires exactly one site_* group per host,
          single-site forbids site_* groups (found {{ group_names | select('match', '^site_') | list }})
        quiet: true

    - name: Stretched topology - broker.rack matches the site
      ansible.builtin.assert:
        that: >-
          kafka_broker_custom_properties['broker.rack'] | default('')
          == (group_names | select('match', '^site_') | first | regex_replace('^site_', ''))
        fail_msg: "{{ inventory_hostname }}: broker.rack must equal its site code (group_vars/site_<code>.yml)"
        quiet: true
      when:
        - iac_topology == 'stretched-2dc'
        - inventory_hostname in groups['kafka_broker']

    # ---------------------------------------------------------------- cluster layout
    - name: Cluster layout checks (once, on the control node)
      delegate_to: localhost
      run_once: true
      block:
        - name: KRaft layout is valid
          ansible.builtin.assert:
            that:
              - groups['kafka_controller'] | default([]) | length >= 3
              - (groups['kafka_controller'] | length) is odd
            fail_msg: "Need an odd number (>= 3) of KRaft controllers."
            quiet: true

        - name: Dedicated controllers and unique node_id values
          ansible.builtin.assert:
            that:
              - groups['kafka_controller'] | intersect(groups['kafka_broker'] | default([])) | length == 0
              - iac_node_ids | length == iac_node_ids | unique | length
            fail_msg: >-
              Need dedicated controllers (no broker/controller co-location) and node_id values unique across
              controllers and brokers. node_ids: {{ iac_node_ids }}
            quiet: true
          vars:
            iac_node_ids: >-
              {{ (groups['kafka_controller'] + groups['kafka_broker'])
                 | map('extract', hostvars, 'node_id') | map('int') | list }}
          when: not (iac_kraft_colocated | default(false) | bool)

        - name: Enough brokers for the internal replication factor
          ansible.builtin.assert:
            that: groups['kafka_broker'] | length >= default_internal_replication_factor | int
            fail_msg: "{{ groups['kafka_broker'] | length }} brokers < default_internal_replication_factor {{ default_internal_replication_factor }}"
            quiet: true

        - name: Stretched topology - controllers in every site
          ansible.builtin.assert:
            that: groups['kafka_controller'] | intersect(groups['site_' ~ item] | default([])) | length > 0
            fail_msg: "site_{{ item }} has no KRaft controller"
            quiet: true
          loop: "{{ iac_sites | default([]) }}"
          when: iac_topology == 'stretched-2dc'

        - name: Protected environments keep secret masking enabled
          ansible.builtin.assert:
            that:
              - mask_sensitive_logs | bool
              - mask_sensitive_diff | bool
            quiet: true
          when: iac_env in iac_protected_envs
