---
# Confluent Platform Service Health Verification
- name: Check Systemd Services State
  hosts: kafka_controller:kafka_broker:schema_registry:kafka_connect:kafka_rest
  gather_facts: false
  tasks:
    - name: Populate Service Status Facts
      ansible.builtin.service_facts:

    - name: Verify Confluent Services Are Active
      ansible.builtin.assert:
        that:
          - ansible_facts.services[item].state == 'running'
        fail_msg: "CRITICAL: Service '{{ item }}' is not running on '{{ inventory_hostname }}'!"
        success_msg: "OK: Service '{{ item }}' is running."
      loop: "{{ ansible_facts.services.keys() | select('match', '^confluent-.*') | list }}"
      when: ansible_facts.services.keys() | select('match', '^confluent-.*') | list | length > 0
