---
# =============================================================================
# Secrets of the generated configuration files (shared/base/10-security.yml, "Passwords in generated files").
#
# Writes the secret files of every component to iac_config_secrets_dir on every host and sets the references
# for the rest of the ansible-playbook process (tasks/config_secrets.yml):
#   <component>.env         systemd EnvironmentFile of the service, iac_config_secrets_owner 0600   (provider env)
#   <component>.properties  FileConfigProvider file, service user 0400                        (provider file, tool configs)
# Rootless deployments (rootless_enabled): the deploy user owns everything and runs every component, so no service
# accounts are created and nothing needs root.
# site.yml imports this playbook before confluent.platform.all, so the files exist before any role writes a
# reference or starts a service.
#
#   scripts/run.sh <environment> config_secrets          # secret files only, restarts nothing
# A running service reads its secrets only at startup: run the restart playbook after changing a secret.
# Migration from Secret Protection (provider file only):
#   scripts/run.sh <environment> config_secrets -e iac_config_secrets_verify=true
# =============================================================================
- name: Secrets from the hosts (iac_secrets_source host)
  ansible.builtin.import_playbook: secrets_from_hosts.yml

- name: Secrets of the generated configuration files
  hosts: kafka_controller:kafka_broker:schema_registry:kafka_connect:kafka_rest:control_center_next_gen
  # cp-ansible derives the component paths (kafka_broker.config_file, ...) from OS facts
  gather_facts: true
  gather_subset: [min]
  tasks:
    # tags: always - a run limited with --tags (e.g. kafka_broker) must still evaluate the properties exactly
    # as the component plays do
    - name: Load cp-ansible variables
      ansible.builtin.import_role:
        name: confluent.platform.variables
      tags: [always]

    # Only the role DEFAULTS are needed (e.g. *_service_overrides); the tasks never run
    # (same technique as render_config.yml).
    - name: Expose kafka_controller role defaults (tasks skipped)
      ansible.builtin.import_role:
        name: confluent.platform.kafka_controller
        tasks_from: health_check.yml
      when: false
      tags: [never]
    - name: Expose kafka_broker role defaults (tasks skipped)
      ansible.builtin.import_role:
        name: confluent.platform.kafka_broker
        tasks_from: health_check.yml
      when: false
      tags: [never]
    - name: Expose schema_registry role defaults (tasks skipped)
      ansible.builtin.import_role:
        name: confluent.platform.schema_registry
        tasks_from: health_check.yml
      when: false
      tags: [never]
    - name: Expose kafka_connect role defaults (tasks skipped)
      ansible.builtin.import_role:
        name: confluent.platform.kafka_connect
        tasks_from: health_check.yml
      when: false
      tags: [never]
    - name: Expose kafka_rest role defaults (tasks skipped)
      ansible.builtin.import_role:
        name: confluent.platform.kafka_rest
        tasks_from: health_check.yml
      when: false
      tags: [never]
    - name: Expose control_center_next_gen role defaults (tasks skipped)
      ansible.builtin.import_role:
        name: confluent.platform.control_center_next_gen
        tasks_from: health_check.yml
      when: false
      tags: [never]

    - name: Secret values and references
      ansible.builtin.import_tasks: tasks/config_secrets.yml
      when: iac_config_secrets_enabled | bool

    - name: Existing users
      ansible.builtin.getent:
        database: passwd
      when: iac_config_secrets_enabled | bool
      tags: [always]

    # On a new host the secret files are written before cp-ansible creates the service accounts.
    # Same attributes as the component roles, which skip existing users. Rootless: the deploy user exists already.
    - name: Service groups
      ansible.builtin.group:
        name: "{{ lookup('ansible.builtin.vars', item ~ '_group') }}"
      loop: "{{ iac_config_secrets_components | map(attribute='service') | unique | select('in', group_names) | list }}"
      when:
        - iac_config_secrets_enabled | bool
        - not (rootless_enabled | default(false) | bool)
      tags: [always]

    - name: Service users that do not exist yet
      ansible.builtin.user:
        name: "{{ lookup('ansible.builtin.vars', item ~ '_user') }}"
        comment: Confluent Platform
        system: true
        shell: "{{ user_login_shell }}"
        group: "{{ lookup('ansible.builtin.vars', item ~ '_group') }}"
      loop: "{{ iac_config_secrets_components | map(attribute='service') | unique | select('in', group_names) | list }}"
      when:
        - iac_config_secrets_enabled | bool
        - not (rootless_enabled | default(false) | bool)
        - lookup('ansible.builtin.vars', item ~ '_user') not in ansible_facts.getent_passwd
      tags: [always]

    # 0711: service users reach their own 0400 file without listing the directory. Rootless: one user, 0700.
    - name: Secret file directory
      ansible.builtin.file:
        path: "{{ iac_config_secrets_dir }}"
        state: directory
        owner: "{{ iac_config_secrets_owner }}"
        group: "{{ iac_config_secrets_group }}"
        mode: "{{ '0700' if rootless_enabled | default(false) | bool else '0711' }}"
      when: iac_config_secrets_enabled | bool
      tags: [always]

    - name: Secret values are single-line
      ansible.builtin.assert:
        that: iac_config_secrets[item.name]['values'].values() | select('search', '[\r\n]') | list | length == 0
        fail_msg: "{{ item.name }}: a secret value contains a line break, which neither file format supports"
        quiet: true
      loop: "{{ iac_config_secrets_components | selectattr('service', 'in', group_names) | list }}"
      loop_control:
        label: "{{ item.name }}"
      when: iac_config_secrets_enabled | bool
      tags: [always]

    # systemd EnvironmentFile format: double quotes, with \ " $ ` escaped by a backslash (tested with
    # systemd-run and org.apache.kafka.common.config.provider.EnvVarConfigProvider). The characters are task
    # variables because Ansible escapes backslashes inside inline Jinja expressions once more.
    - name: Environment files of the services, read by systemd (provider env)
      ansible.builtin.copy:
        dest: "{{ iac_config_secrets_dir }}/{{ item.name }}.env"
        content: |
          # {{ item.name }} | managed by playbooks/config_secrets.yml | systemd EnvironmentFile of the service
          {% for key, value in iac_config_secrets[item.name]['values'] | dictsort %}
          {% set escaped = value | replace(iac_bs, iac_bs ~ iac_bs) | replace(iac_dq, iac_bs ~ iac_dq)
                                 | replace(iac_dollar, iac_bs ~ iac_dollar) | replace(iac_bt, iac_bs ~ iac_bt) %}
          {{ iac_config_secrets[item.name].env_names[key] }}="{{ escaped }}"
          {% endfor %}
        owner: "{{ iac_config_secrets_owner }}"
        group: "{{ iac_config_secrets_group }}"
        mode: "0600"
      vars:
        iac_bs: "\\"
        iac_dq: '"'
        iac_dollar: "$"
        iac_bt: "`"
      loop: "{{ iac_config_secrets_components | selectattr('service', 'in', group_names) | list }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - iac_config_secrets_enabled | bool
        - iac_config_secrets[item.name].mode == 'env'
      no_log: true
      diff: false
      tags: [always]

    # java.util.Properties format: backslashes are escaped (FileConfigProvider reads the file with Properties).
    - name: Secret files, readable by the service user only (provider file, tool configurations)
      ansible.builtin.copy:
        dest: "{{ iac_config_secrets_dir }}/{{ item.name }}.properties"
        content: |
          # {{ item.name }} | managed by playbooks/config_secrets.yml | read through FileConfigProvider
          {% for key, value in iac_config_secrets[item.name]['values'] | dictsort %}
          {{ key }}={{ value | replace(iac_bs, iac_bs ~ iac_bs) }}
          {% endfor %}
        owner: "{{ iac_config_secrets[item.name].owner }}"
        group: "{{ iac_config_secrets[item.name].group }}"
        mode: "0400"
      vars:
        iac_bs: "\\"
      loop: "{{ iac_config_secrets_components | selectattr('service', 'in', group_names) | list }}"
      loop_control:
        label: "{{ item.name }}"
      when:
        - iac_config_secrets_enabled | bool
        - iac_config_secrets[item.name].mode == 'file'
      no_log: true
      diff: false
      tags: [always]

    # Migration from Secret Protection: proves before any restart that every value in the new files equals the
    # value the service runs with today (decrypted ${securepass:...} or plain text). Key names only.
    - name: Verification is available for provider file
      ansible.builtin.assert:
        that: iac_config_secrets_provider == 'file'
        fail_msg: "iac_config_secrets_verify compares FileConfigProvider files; set iac_config_secrets_provider: file for the migration run"
        quiet: true
      when:
        - iac_config_secrets_enabled | bool
        - iac_config_secrets_verify | default(false) | bool
      tags: [always]

    - name: Compare the secret files with the running configuration
      ansible.builtin.script:
        cmd: >-
          compare_config_secrets.py --cli {{ confluent_cli_path }}
          {% for item in iac_config_secrets_components | selectattr('service', 'in', group_names) %}
          --component {{ item.name }},{{ lookup('ansible.builtin.vars', item.service)[item.config] }},{{
          lookup('ansible.builtin.vars', item.name ~ '_secrets_protection_file') }},{{
          lookup('ansible.builtin.vars', item.service).systemd_override }},{{
          iac_config_secrets_dir }}/{{ item.name }}.properties
          {% endfor %}
        executable: "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      register: iac_config_secrets_compare
      changed_when: false
      failed_when: false
      when:
        - iac_config_secrets_enabled | bool
        - iac_config_secrets_verify | default(false) | bool
      tags: [always]

    - name: Comparison result
      ansible.builtin.debug:
        var: iac_config_secrets_compare.stdout_lines
      when: iac_config_secrets_compare is not skipped
      tags: [always]

    - name: Every value equals the running configuration
      ansible.builtin.assert:
        that: iac_config_secrets_compare.rc == 0
        fail_msg: "{{ iac_config_secrets_compare.stderr | default('') }} - see the comparison result above"
        quiet: true
      when: iac_config_secrets_compare is not skipped
      tags: [always]
