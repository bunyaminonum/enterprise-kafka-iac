---
# LAYER 5 - HOST: cp-node3 also runs Control Center with its Prometheus and Alertmanager.
# Kafka Connect scans its whole plugin path at start-up and needs more than 512 MB of heap (an -Xmx512m worker dies
# with OutOfMemoryError). cp-node3 has the most memory left after the other components, so only this server gets
# a larger Connect heap than the tier's -Xms512m -Xmx1g.
iac_kafka_connect_heap: "-Xms512m -Xmx1536m"
