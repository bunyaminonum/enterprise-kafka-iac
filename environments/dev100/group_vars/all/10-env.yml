---
# =============================================================================
# LAYER 3 - ENVIRONMENT IDENTITY: dev100 (lab)
# Values that identify the environment and its endpoints.
# =============================================================================
iac_env: dev100

# Cluster names (RBAC cluster registry, Control Center)
kafka_broker_cluster_name: cp-dev100
schema_registry_cluster_name: cp-dev100-schema-registry
kafka_connect_cluster_name: cp-dev100-connect
kafka_connect_group_id: cp-dev100-connect

# Directory service: the lab OpenLDAP container on cp-node1 (plain LDAP; THY: ldaps://...:636)
iac_ldap_url: ldap://cp-node1.lab.local:1389
iac_ldap_bind_dn: "cn=ldap-bind-user,dc=lab,dc=local"
iac_ldap_user_search_base: "ou=users,dc=lab,dc=local"
iac_ldap_group_search_base: "ou=groups,dc=lab,dc=local"

# Identity provider (OAuth): none in the lab (auth_mode ldap, 20-components.yml).
# The baseline still references these names, so they keep example values.
iac_oauth_base_url: https://sso.lab.local/oauth2
iac_oauth_expected_audience: kafka-dev100
iac_oauth_client_ids:
  superuser: kafka-dev100-superuser
  schema_registry: kafka-dev100-schema-registry
  kafka_connect: kafka-dev100-connect
  kafka_rest: kafka-dev100-rest-proxy
  control_center: kafka-dev100-control-center
