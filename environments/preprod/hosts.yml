---
# preprod - Production mirror: same topology as production.
# Stretched cluster over dc1 (primary) and dc2 (secondary), KRaft quorum 2 + 1.
# node_id is PINNED per KRaft node and unique across controllers and brokers.
# Observers are not a separate group: they are brokers selected by broker.rack and placement constraints (OD-06).
all:
  children:
    env_preprod:
      children:
        kafka_controller:
          hosts:
            preprod-dc1-ctrl-01.internal.net: { node_id: 1 }
            preprod-dc1-ctrl-02.internal.net: { node_id: 2 }
            preprod-dc2-ctrl-03.internal.net: { node_id: 3 }
        kafka_broker:
          hosts:
            preprod-dc1-broker-01.internal.net: { node_id: 101 }
            preprod-dc1-broker-02.internal.net: { node_id: 102 }
            preprod-dc1-broker-03.internal.net: { node_id: 103 }
            preprod-dc2-broker-04.internal.net: { node_id: 104 }
            preprod-dc2-broker-05.internal.net: { node_id: 105 }
            preprod-dc2-broker-06.internal.net: { node_id: 106 }
        schema_registry:
          hosts:
            preprod-dc1-sr-01.internal.net:
            preprod-dc2-sr-02.internal.net:
        kafka_connect:
          hosts:
            preprod-dc1-connect-01.internal.net:
            preprod-dc2-connect-02.internal.net:
        kafka_rest:
          hosts:
            preprod-dc1-rest-01.internal.net:
            preprod-dc2-rest-02.internal.net:
        control_center_next_gen:
          hosts:
            preprod-dc1-c3-01.internal.net:    # first instance
            preprod-dc2-c3-02.internal.net:    # second instance, see host_vars/preprod-dc2-c3-02.internal.net.yml
        # Site groups: site-local settings (group_vars/site_<code>.yml) and site-scoped runs (--limit site_dc2).
        site_dc1:
          hosts:
            preprod-dc1-ctrl-01.internal.net:
            preprod-dc1-ctrl-02.internal.net:
            preprod-dc1-broker-01.internal.net:
            preprod-dc1-broker-02.internal.net:
            preprod-dc1-broker-03.internal.net:
            preprod-dc1-sr-01.internal.net:
            preprod-dc1-connect-01.internal.net:
            preprod-dc1-rest-01.internal.net:
            preprod-dc1-c3-01.internal.net:
        site_dc2:
          hosts:
            preprod-dc2-ctrl-03.internal.net:
            preprod-dc2-broker-04.internal.net:
            preprod-dc2-broker-05.internal.net:
            preprod-dc2-broker-06.internal.net:
            preprod-dc2-sr-02.internal.net:
            preprod-dc2-connect-02.internal.net:
            preprod-dc2-rest-02.internal.net:
            preprod-dc2-c3-02.internal.net:
