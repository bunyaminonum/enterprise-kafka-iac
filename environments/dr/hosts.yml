---
# dr - Disaster recovery: independent cluster and KRaft quorum, fed by Cluster Linking.
# Single data center. node_id is PINNED per KRaft node and unique across controllers and brokers;
# controller.quorum.voters is derived from it. Controllers and brokers run on dedicated hosts.
all:
  children:
    env_dr:
      children:
        kafka_controller:
          hosts:
            dr-ctrl-01.internal.net: { node_id: 1 }
            dr-ctrl-02.internal.net: { node_id: 2 }
            dr-ctrl-03.internal.net: { node_id: 3 }
        kafka_broker:
          hosts:
            dr-broker-01.internal.net: { node_id: 101 }
            dr-broker-02.internal.net: { node_id: 102 }
            dr-broker-03.internal.net: { node_id: 103 }
        schema_registry:
          hosts:
            dr-sr-01.internal.net:
        kafka_connect:
          hosts:
            dr-connect-01.internal.net:
            dr-connect-02.internal.net:
        kafka_rest:
          hosts:
            dr-rest-01.internal.net:
        control_center_next_gen:
          hosts:
            dr-c3-01.internal.net:
