---
# dev - Shared engineering environment.
# Single data center. node_id is PINNED per KRaft node and unique across controllers and brokers;
# controller.quorum.voters is derived from it. Controllers and brokers run on dedicated hosts.
all:
  children:
    env_dev:
      children:
        kafka_controller:
          hosts:
            dev-ctrl-01.internal.net: { node_id: 1 }
            dev-ctrl-02.internal.net: { node_id: 2 }
            dev-ctrl-03.internal.net: { node_id: 3 }
        kafka_broker:
          hosts:
            dev-broker-01.internal.net: { node_id: 101 }
            dev-broker-02.internal.net: { node_id: 102 }
            dev-broker-03.internal.net: { node_id: 103 }
        schema_registry:
          hosts:
            dev-sr-01.internal.net:
        kafka_connect:
          hosts:
            dev-connect-01.internal.net:
        kafka_rest:
          hosts:
            dev-rest-01.internal.net:
        control_center_next_gen:
          hosts:
            dev-c3-01.internal.net:
