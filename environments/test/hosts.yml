---
# test - Integration testing.
# Single data center. node_id is PINNED per KRaft node and unique across controllers and brokers;
# controller.quorum.voters is derived from it. Controllers and brokers run on dedicated hosts.
all:
  children:
    env_test:
      children:
        kafka_controller:
          hosts:
            test-ctrl-01.internal.net: { node_id: 1 }
            test-ctrl-02.internal.net: { node_id: 2 }
            test-ctrl-03.internal.net: { node_id: 3 }
        kafka_broker:
          hosts:
            test-broker-01.internal.net: { node_id: 101 }
            test-broker-02.internal.net: { node_id: 102 }
            test-broker-03.internal.net: { node_id: 103 }
        schema_registry:
          hosts:
            test-sr-01.internal.net:
        kafka_connect:
          hosts:
            test-connect-01.internal.net:
        kafka_rest:
          hosts:
            test-rest-01.internal.net:
        control_center_next_gen:
          hosts:
            test-c3-01.internal.net:
