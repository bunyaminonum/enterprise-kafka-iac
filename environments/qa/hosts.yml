---
# qa - Performance and acceptance testing with component HA.
# Single data center. node_id is PINNED per KRaft node and unique across controllers and brokers;
# controller.quorum.voters is derived from it. Controllers and brokers run on dedicated hosts.
all:
  children:
    env_qa:
      children:
        kafka_controller:
          hosts:
            qa-ctrl-01.internal.net: { node_id: 1 }
            qa-ctrl-02.internal.net: { node_id: 2 }
            qa-ctrl-03.internal.net: { node_id: 3 }
        kafka_broker:
          hosts:
            qa-broker-01.internal.net: { node_id: 101 }
            qa-broker-02.internal.net: { node_id: 102 }
            qa-broker-03.internal.net: { node_id: 103 }
        schema_registry:
          hosts:
            qa-sr-01.internal.net:
            qa-sr-02.internal.net:
        kafka_connect:
          hosts:
            qa-connect-01.internal.net:
            qa-connect-02.internal.net:
        kafka_rest:
          hosts:
            qa-rest-01.internal.net:
            qa-rest-02.internal.net:
        control_center_next_gen:
          hosts:
            qa-c3-01.internal.net:
