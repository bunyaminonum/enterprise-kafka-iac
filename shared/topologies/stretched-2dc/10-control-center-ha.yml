---
# =============================================================================
# LAYER 2b - TOPOLOGY: stretched-2dc - Control Center Next Gen, one instance per site
# (kept in its own file: files of a layer directory are deep-merged in lexical order)
# =============================================================================
# Two Control Center instances, one per site. cp-ansible implements this with the active-active pattern
# (docs/sample_inventories/c3-next-gen-active-active-setup): both run and both receive telemetry.
# An "active/standby" operation is a load-balancer routing decision (OD-07).
# The second instance needs: host-count validation skipped, a second telemetry exporter on every broker
# and controller (below), and per-host settings in host_vars/<second C3 host>.yml.
skip_control_center_next_gen_host_count_validation: true
iac_c3_secondary_host: "{{ groups['control_center_next_gen'][1] | default('') }}"
iac_c3_secondary_otlp_url: >-
  {{ control_center_next_gen_dependency_prometheus_schema }}://{{ iac_c3_secondary_host }}:{{ control_center_next_gen_dependency_prometheus_port }}/api/v1/otlp

# The upstream sample sets the controller copy under kafka_broker_custom_properties in the controller
# group, which the controller role never reads (kafka_controller_final_properties only merges
# kafka_controller_custom_properties). Both dictionaries are set here.
# If Prometheus TLS is enabled for C3 (control_center_next_gen_dependency_prometheus_ssl_enabled),
# mirror the confluent.telemetry.exporter._c3.https.ssl.* keys for _c3-2 as well.
kafka_broker_custom_properties:
  confluent.telemetry.exporter._c3-2.enabled: "{{ (iac_c3_secondary_host | length > 0) | string | lower }}"
  confluent.telemetry.exporter._c3-2.type: http
  confluent.telemetry.exporter._c3-2.client.base.url: "{{ iac_c3_secondary_otlp_url }}"
  confluent.telemetry.exporter._c3-2.client.compression: gzip
  confluent.telemetry.exporter._c3-2.api.key: "{{ kafka_broker_telemetry_control_center_next_gen_user }}"
  confluent.telemetry.exporter._c3-2.api.secret: "{{ kafka_broker_telemetry_control_center_next_gen_password }}"
  confluent.telemetry.exporter._c3-2.buffer.pending.batches.max: 80
  confluent.telemetry.exporter._c3-2.buffer.batch.items.max: 4000
  confluent.telemetry.exporter._c3-2.buffer.inflight.submissions.max: 10
  confluent.telemetry.exporter._c3-2.metrics.include: "^(?:(?!delta)(?!jvm).)*$"

kafka_controller_custom_properties:
  confluent.telemetry.exporter._c3-2.enabled: "{{ (iac_c3_secondary_host | length > 0) | string | lower }}"
  confluent.telemetry.exporter._c3-2.type: http
  confluent.telemetry.exporter._c3-2.client.base.url: "{{ iac_c3_secondary_otlp_url }}"
  confluent.telemetry.exporter._c3-2.client.compression: gzip
  confluent.telemetry.exporter._c3-2.api.key: "{{ kafka_controller_telemetry_control_center_next_gen_user }}"
  confluent.telemetry.exporter._c3-2.api.secret: "{{ kafka_controller_telemetry_control_center_next_gen_password }}"
  confluent.telemetry.exporter._c3-2.buffer.pending.batches.max: 80
  confluent.telemetry.exporter._c3-2.buffer.batch.items.max: 4000
  confluent.telemetry.exporter._c3-2.buffer.inflight.submissions.max: 10
  confluent.telemetry.exporter._c3-2.metrics.include: "^(?:(?!delta)(?!jvm).)*$"
