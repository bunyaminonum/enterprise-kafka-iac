---
# =============================================================================
# LAYER 1 - ORGANISATION BASELINE: WHERE THE SECRETS COME FROM
#
# No secret is stored in git and Ansible Vault is not used. Every secret is read from an environment
# variable of the process that runs ansible-playbook:
#   interactive run   root-only env file on the control node: set -a; . <file>; set +a   (secrets.env.example)
#   AWX / Tower       custom credential type per environment that injects the same variables
# The variable NAMES are the same in every environment; the VALUES belong to the environment of the run.
# Preflight refuses to deploy while a registered secret (iac_required_secrets) is empty, and names the
# missing variable. Static validation (CI) replaces the registered secrets with placeholders.
#
# The vault_* names are the secret namespace of this repository (iac_required_secrets, check-vars.py).
# An environment that still keeps an encrypted 90-vault.yml overrides these lines with its own values.
# =============================================================================
vault_ldap_bind_password: "{{ lookup('ansible.builtin.env', 'IAC_SECRET_LDAP_BIND_PASSWORD') }}"
vault_mds_super_user_password: "{{ lookup('ansible.builtin.env', 'IAC_SECRET_MDS_SUPER_USER_PASSWORD') }}"
vault_kafka_broker_ldap_password: "{{ lookup('ansible.builtin.env', 'IAC_SECRET_KAFKA_BROKER_LDAP_PASSWORD') }}"
vault_schema_registry_ldap_password: "{{ lookup('ansible.builtin.env', 'IAC_SECRET_SCHEMA_REGISTRY_LDAP_PASSWORD') }}"
vault_kafka_connect_ldap_password: "{{ lookup('ansible.builtin.env', 'IAC_SECRET_KAFKA_CONNECT_LDAP_PASSWORD') }}"
vault_kafka_rest_ldap_password: "{{ lookup('ansible.builtin.env', 'IAC_SECRET_KAFKA_REST_LDAP_PASSWORD') }}"
vault_control_center_next_gen_ldap_password: "{{ lookup('ansible.builtin.env', 'IAC_SECRET_CONTROL_CENTER_NEXT_GEN_LDAP_PASSWORD') }}"

# OAuth client secrets (auth_mode oauth / ldap_with_oauth)
vault_oauth_superuser_client_secret: "{{ lookup('ansible.builtin.env', 'IAC_SECRET_OAUTH_SUPERUSER_CLIENT_SECRET') }}"
vault_schema_registry_oauth_client_secret: "{{ lookup('ansible.builtin.env', 'IAC_SECRET_SCHEMA_REGISTRY_OAUTH_CLIENT_SECRET') }}"
vault_kafka_connect_oauth_client_secret: "{{ lookup('ansible.builtin.env', 'IAC_SECRET_KAFKA_CONNECT_OAUTH_CLIENT_SECRET') }}"
vault_kafka_rest_oauth_client_secret: "{{ lookup('ansible.builtin.env', 'IAC_SECRET_KAFKA_REST_OAUTH_CLIENT_SECRET') }}"
vault_control_center_oauth_client_secret: "{{ lookup('ansible.builtin.env', 'IAC_SECRET_CONTROL_CENTER_OAUTH_CLIENT_SECRET') }}"

# prod tier (shared/tiers/prod) and dr (Cluster Linking)
vault_confluent_license: "{{ lookup('ansible.builtin.env', 'IAC_SECRET_CONFLUENT_LICENSE') }}"
vault_password_encoder_secret: "{{ lookup('ansible.builtin.env', 'IAC_SECRET_PASSWORD_ENCODER_SECRET') }}"
