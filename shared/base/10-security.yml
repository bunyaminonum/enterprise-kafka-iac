---
# =============================================================================
# LAYER 1 - ORGANISATION BASELINE: SECURITY
#
# Target model:
#   client / application traffic    -> SASL/OAUTHBEARER (corporate identity provider)
#   broker and KRaft traffic        -> SASL_SSL: SCRAM-SHA-512, PLAIN between the KRaft controllers only
#   authorization                   -> Confluent RBAC (MDS) backed by Active Directory (LDAPS)
#   passwords in generated files    -> ${env:...} references (EnvVarConfigProvider, playbooks/config_secrets.yml)
#   secrets of this repository      -> environment variables IAC_SECRET_* (00-base/15-secrets.yml), no Ansible Vault
#
# The cp-ansible 8.3.2 default listeners already implement this model, no custom listeners are needed:
#   INTERNAL   :9092 -> OAUTHBEARER when auth_mode is ldap / oauth / ldap_with_oauth  (applications, CP components)
#   BROKER     :9091 -> sasl_protocol                                                (broker to broker)
#   CONTROLLER :9093 -> kafka_controller_sasl_protocol (defaults to sasl_protocol)
#
# Open decisions: OD-01 account naming, OD-02 auth mode, OD-03 MDS topology,
#                 OD-04 certificate source, OD-05 MDS super user identity
# =============================================================================

# ---- Secrets registry --------------------------------------------------------
# Secrets every environment must provide. The vault_* names are the secret namespace of this repository;
# their values come from environment variables (15-secrets.yml, template: secrets.env.example).
# A DICTIONARY on purpose: tiers and environments add entries (lists would be replaced, not merged).
# Used by preflight (deploy mode: not empty and not a placeholder) and by static validation
# (CI replaces every registered secret with a placeholder, so no secret is needed).
iac_required_secrets:
  vault_ldap_bind_password: true
  vault_mds_super_user_password: true
  vault_kafka_broker_ldap_password: true
  vault_schema_registry_ldap_password: true
  vault_kafka_connect_ldap_password: true
  vault_kafka_rest_ldap_password: true
  vault_control_center_next_gen_ldap_password: true
  vault_oauth_superuser_client_secret: true
  vault_schema_registry_oauth_client_secret: true
  vault_kafka_connect_oauth_client_secret: true
  vault_kafka_rest_oauth_client_secret: true
  vault_control_center_oauth_client_secret: true
  vault_kafka_broker_scram_password: true
  vault_kafka_controller_plain_password: true

# ---- Secret files on the control node ------------------------------------------
# Files cp-ansible would read on the CONTROL NODE and copy to the hosts (e.g. the Secret Protection
# security.properties). None is needed at the moment: no Kerberos keytabs (SCRAM/PLAIN), the host certificates
# are placed on the hosts. The pipeline materialises such files into IAC_SECRETS_DIR before the run
# (default: .secrets/<environment> in the repository root, git-ignored). The default is derived from playbook_dir,
# not from inventory_dir: Tower hands the job a generated inventory outside the project.
iac_secrets_dir: "{{ lookup('ansible.builtin.env', 'IAC_SECRETS_DIR', default=playbook_dir ~ '/../.secrets/' ~ iac_env) }}"

# ---- Passwords in generated files ----------------------------------------------------
# cp-ansible writes every password-like value (keystore passwords, JAAS configs, basic auth user info, LDAP
# credentials, license) into the properties files. playbooks/config_secrets.yml (imported by site.yml) takes
# these values out of the properties files and makes the roles write references instead:
#   provider env  (default)  ${env:CP_SECRET_<KEY>}; each service gets a systemd EnvironmentFile
#                            <iac_config_secrets_dir>/<component>.env (iac_config_secrets_owner, 0600).
#                            systemctl show lists only the path of that file, never its values.
#   provider file            ${file:<iac_config_secrets_dir>/<component>.properties:<key>} (service user, 0400)
# client.properties (kafka-* CLI tools, cp-ansible health checks) always uses provider file: the tools do not
# run with the environment of the service.
# The key patterns are the ones cp-ansible's Secret Protection encrypts (roles/common/tasks/secrets_protection.yml).
# A changed secret is written by site but only read at startup: run the restart playbook afterwards.
iac_config_secrets_enabled: true
iac_config_secrets_provider: env
iac_config_secrets_env_prefix: CP_SECRET_
iac_config_secrets_dir: /var/ssl/private/iac-secrets
# Owner of the secret directory and of the environment files: root, because systemd (the system manager) reads the
# EnvironmentFile before it starts the service as its service account. A rootless deployment would use the deploy user.
iac_config_secrets_owner: "{{ deployment_user if rootless_enabled | bool else 'root' }}"
iac_config_secrets_group: "{{ deployment_group if rootless_enabled | bool else 'root' }}"
iac_config_secrets_key_patterns:
  - '.*password.*'
  - '.*basic.auth.user.info.*'
  - '^ldap.java.naming.security.credentials$'
  - '^confluent.license$'
  - '.*sasl.jaas.config'
# Secret Protection stays off; regenerate_masterkey false keeps a re-enabled Secret Protection from
# generating a new master key on every run.
secrets_protection_enabled: false
regenerate_masterkey: false

# ---- TLS -------------------------------------------------------------------
# Host certificates are issued by the corporate CA and placed on the hosts BEFORE the run
# (ssl_custom_certs_remote_src: true means the paths below are paths on the target hosts).
# The OS team places them in iac_host_certs_dir (root); cp-ansible reads them as root and builds the keystores of
# every component below ssl_file_dir (cp-ansible default /var/ssl/private).
#   ca-bundle.crt              CA chain: issuing (intermediate) CA and root CA, PEM
#   <inventory_hostname>.crt   host certificate, PEM; SAN with the host name; EKU serverAuth (no listener
#                              requires client certificates, so clientAuth is not needed)
#   <inventory_hostname>.key   private key, PEM, readable by root only (0600)
iac_host_certs_dir: /var/ssl/private
ssl_enabled: true
ssl_custom_certs: true
ssl_custom_certs_remote_src: true
ssl_ca_cert_filepath: "{{ iac_host_certs_dir }}/ca-bundle.crt"
ssl_signed_cert_filepath: "{{ iac_host_certs_dir }}/{{ inventory_hostname }}.crt"
ssl_key_filepath: "{{ iac_host_certs_dir }}/{{ inventory_hostname }}.key"
# ssl_key_password: "{{ vault_ssl_key_password }}"     # only if the private keys are encrypted

# ---- Broker and KRaft authentication: SASL_SSL with SCRAM-SHA-512 and PLAIN ----------------
#   broker <-> broker, controller -> broker   BROKER listener :9091       SCRAM-SHA-512
#   broker -> controller                      CONTROLLER listener :9093   SCRAM-SHA-512
#   controller <-> controller                 CONTROLLER listener :9093   PLAIN
# KRaft controllers cannot authenticate each other with SCRAM: its credentials live in the metadata log that the
# controllers serve (Confluent: "SCRAM is not supported for KRaft controller-to-controller communication"; the
# documented setting is kafka_controller_sasl_protocol: plain,scram). GSSAPI is not used anywhere.
# The FIRST value of kafka_controller_sasl_protocol is what controllers AND brokers use towards the controllers;
# sasl.mechanism.controller.protocol in shared/base/31-kafka-broker.yml keeps the brokers on SCRAM-SHA-512, so
# PLAIN is only used between the controllers.
sasl_protocol: scram
kafka_controller_sasl_protocol: plain,scram
# SCRAM users live in the KRaft metadata: cp-ansible adds admin when it formats the controllers' storage
# (kafka-storage format --add-scram) and creates all of them with kafka-configs after the first start.
# PLAIN users live in the JAAS configuration of the CONTROLLER listener (user_<principal>="<password>").
# admin is the identity brokers (SCRAM) and controllers (PLAIN) log in with. Both are called kafka: cp-ansible
# adds User:<principal> of the first mechanism to super.users, and a controller must accept a broker that logs
# in with the other mechanism.
# cp-ansible also creates its default users (client, schema_registry, ...) with PUBLIC default passwords
# (client-secret, ...). The components authenticate with OAUTHBEARER on INTERNAL :9092 and never use them, so
# their passwords are derived from the admin passwords: nobody knows them and they need no secret of their own.
# The passwords are written into JAAS configurations and kafka-configs arguments: letters and digits only
# (preflight checks it).
sasl_scram_users:
  admin:
    principal: kafka
    password: "{{ vault_kafka_broker_scram_password }}"
  client:
    principal: client
    password: "{{ (vault_kafka_broker_scram_password ~ ':client') | hash('sha256') }}"
  schema_registry:
    principal: schema_registry
    password: "{{ (vault_kafka_broker_scram_password ~ ':schema_registry') | hash('sha256') }}"
  kafka_connect:
    principal: kafka_connect
    password: "{{ (vault_kafka_broker_scram_password ~ ':kafka_connect') | hash('sha256') }}"
  kafka_rest:
    principal: kafka_rest
    password: "{{ (vault_kafka_broker_scram_password ~ ':kafka_rest') | hash('sha256') }}"
  ksql:
    principal: ksql
    password: "{{ (vault_kafka_broker_scram_password ~ ':ksql') | hash('sha256') }}"
  control_center_next_gen:
    principal: control_center
    password: "{{ (vault_kafka_broker_scram_password ~ ':control_center_next_gen') | hash('sha256') }}"
  kafka_connect_replicator:
    principal: kafka_connect_replicator
    password: "{{ (vault_kafka_broker_scram_password ~ ':kafka_connect_replicator') | hash('sha256') }}"
sasl_plain_users:
  admin:
    principal: kafka
    password: "{{ vault_kafka_controller_plain_password }}"
  client:
    principal: client
    password: "{{ (vault_kafka_controller_plain_password ~ ':client') | hash('sha256') }}"
  schema_registry:
    principal: schema_registry
    password: "{{ (vault_kafka_controller_plain_password ~ ':schema_registry') | hash('sha256') }}"
  kafka_connect:
    principal: kafka_connect
    password: "{{ (vault_kafka_controller_plain_password ~ ':kafka_connect') | hash('sha256') }}"
  kafka_rest:
    principal: kafka_rest
    password: "{{ (vault_kafka_controller_plain_password ~ ':kafka_rest') | hash('sha256') }}"
  ksql:
    principal: ksql
    password: "{{ (vault_kafka_controller_plain_password ~ ':ksql') | hash('sha256') }}"
  control_center_next_gen:
    principal: control_center
    password: "{{ (vault_kafka_controller_plain_password ~ ':control_center_next_gen') | hash('sha256') }}"
  kafka_connect_replicator:
    principal: kafka_connect_replicator
    password: "{{ (vault_kafka_controller_plain_password ~ ':kafka_connect_replicator') | hash('sha256') }}"

# ---- Authorization: RBAC + OAuth ---------------------------------------------------
rbac_enabled: true
# ldap_with_oauth: MDS authenticates users against Active Directory AND accepts tokens of the corporate
# identity provider; CP components act as OAuth clients on the INTERNAL listener.
auth_mode: ldap_with_oauth                     # TODO(OD-02): confirm (LDAP + OAuth) vs OAuth only
oauth_issuer_url: "{{ iac_oauth_base_url }}"   # iac_oauth_* values are set per environment (10-env.yml)
oauth_token_uri: "{{ iac_oauth_base_url }}/token"
oauth_jwks_uri: "{{ iac_oauth_base_url }}/keys"   # TODO: real IdP endpoints
oauth_expected_audience: "{{ iac_oauth_expected_audience }}"
# Kafka 4.x clients only fetch tokens/JWKS from URLs allowed by -Dorg.apache.kafka.sasl.oauthbearer.allowed.urls.
# cp-ansible writes "*" (allow any URL) unless this is true; true restricts it to oauth_token_uri and oauth_jwks_uri.
whitelist_explicit_oauth_urls: true
oauth_sub_claim: sub                           # TODO: claim that carries the client principal
oauth_groups_claim: groups
# Path on the ANSIBLE CONTROL NODE (copied to hosts and imported into truststores).
oauth_idp_cert_path: "{{ iac_control_node_ca_cert }}"
iac_control_node_ca_cert: /etc/pki/ca-trust/source/anchors/corporate-root-ca.crt   # TODO: real file on the runner

# One IdP client per component. Client IDs are plain values, secrets come from IAC_SECRET_* (15-secrets.yml).
oauth_superuser_client_id: "{{ iac_oauth_client_ids.superuser }}"
oauth_superuser_client_password: "{{ vault_oauth_superuser_client_secret }}"
schema_registry_oauth_user: "{{ iac_oauth_client_ids.schema_registry }}"
schema_registry_oauth_password: "{{ vault_schema_registry_oauth_client_secret }}"
kafka_connect_oauth_user: "{{ iac_oauth_client_ids.kafka_connect }}"
kafka_connect_oauth_password: "{{ vault_kafka_connect_oauth_client_secret }}"
kafka_rest_oauth_user: "{{ iac_oauth_client_ids.kafka_rest }}"
kafka_rest_oauth_password: "{{ vault_kafka_rest_oauth_client_secret }}"
control_center_next_gen_oauth_user: "{{ iac_oauth_client_ids.control_center }}"
control_center_next_gen_oauth_password: "{{ vault_control_center_oauth_client_secret }}"

# ---- LDAP identities -------------------------------------------------------------
# TODO(OD-01): align with the directory naming convention.
# The MDS super user is an administrative identity, separate from the read-only LDAP bind account (OD-05).
mds_super_user: svc-kafka-mds
mds_super_user_password: "{{ vault_mds_super_user_password }}"   # collection default is the literal "password"
kafka_broker_ldap_user: svc-kafka-broker
kafka_broker_ldap_password: "{{ vault_kafka_broker_ldap_password }}"
schema_registry_ldap_user: svc-kafka-schemaregistry
schema_registry_ldap_password: "{{ vault_schema_registry_ldap_password }}"
kafka_connect_ldap_user: svc-kafka-connect
kafka_connect_ldap_password: "{{ vault_kafka_connect_ldap_password }}"
kafka_rest_ldap_user: svc-kafka-proxy
kafka_rest_ldap_password: "{{ vault_kafka_rest_ldap_password }}"
control_center_next_gen_ldap_user: svc-kafka-controlcenter
control_center_next_gen_ldap_password: "{{ vault_control_center_next_gen_ldap_password }}"

# Additional RBAC system admins (e.g. the platform operations team).
rbac_component_additional_system_admins: []    # TODO: operations principals

# MDS -> Active Directory over LDAPS. Group membership is read from the user's memberOf attribute.
# A dictionary: environments override single keys only (see environments/dev100 for an OpenLDAP variant).
kafka_broker_custom_properties:
  ldap.java.naming.provider.url: "{{ iac_ldap_url }}"
  ldap.java.naming.factory.initial: com.sun.jndi.ldap.LdapCtxFactory
  ldap.com.sun.jndi.ldap.read.timeout: 3000
  ldap.java.naming.security.authentication: simple
  ldap.java.naming.security.principal: "{{ iac_ldap_bind_dn }}"
  ldap.java.naming.security.credentials: "{{ vault_ldap_bind_password }}"
  ldap.search.mode: USERS
  ldap.user.search.base: "{{ iac_ldap_user_search_base }}"
  # SUBTREE: Confluent's default (1, ONELEVEL) only finds entries directly below the search base, so accounts in
  # sub-OUs (e.g. uid=svc,ou=serviceaccount,o=corp under base o=corp) are never found and MDS logins fail.
  ldap.user.search.scope: 2
  ldap.group.search.scope: 2
  ldap.user.name.attribute: sAMAccountName
  ldap.user.object.class: user
  ldap.user.memberof.attribute: memberOf
  ldap.user.memberof.attribute.pattern: "CN=([^,]+),.*"
  ldap.group.search.base: "{{ iac_ldap_group_search_base }}"
  ldap.group.object.class: group
  ldap.group.name.attribute: cn
