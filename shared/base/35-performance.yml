---
# Application Log Paths
kafka_broker_log_dir: /var/log/kafka
kafka_controller_log_dir: /var/log/controller
schema_registry_log_dir: /var/log/confluent/schema-registry
kafka_connect_log_dir: /var/log/confluent/kafka-connect
kafka_rest_log_dir: /var/log/confluent/kafka-rest
control_center_next_gen_log_dir: /var/log/confluent/control-center

# Connect Plugin Paths (Archive Install Aware)
kafka_connect_plugins_path:
  - "{{ (archive_destination_path, 'confluent-' ~ confluent_package_version, 'share/java/connect_plugins') | path_join }}"
  - "{{ (archive_destination_path, 'confluent-' ~ confluent_package_version, 'share/filestream-connectors') | path_join }}"

# Storage & Network Tuning
kafka_broker_custom_properties:
  log.dirs: /var/lib/kafka/data
  auto.create.topics.enable: "false"
  num.network.threads: 12
  num.io.threads: 16
  socket.send.buffer.bytes: 102400
  socket.receive.buffer.bytes: 102400
  socket.request.max.bytes: 104857600
  connections.max.idle.ms: 14400000
  message.max.bytes: 33554816
  queued.max.requests: 1001
  max.connections.per.ip: 1500
  max.connections: 40000
  confluent.license: "{{ vault_confluent_license_key | default('') }}"

# Memory Preflight Thresholds
required_total_memory_mb_kafka_controller: 1500
required_total_memory_mb_kafka_broker: 3500
