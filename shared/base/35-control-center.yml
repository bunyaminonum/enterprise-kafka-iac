---
# LAYER 1 - Control Center Next Gen
iac_control_center_heap: "-Xmx6g"

control_center_next_gen_service_environment_overrides:
  CONTROL_CENTER_HEAP_OPTS: "{{ iac_control_center_heap }}"

control_center_next_gen_custom_properties:
  config.providers: env
  config.providers.env.class: org.apache.kafka.common.config.provider.EnvVarConfigProvider
  config.providers.env.param.allowlist.pattern: '^IAC_SECRET_.*'
  confluent.metadata.basic.auth.user.info: "{{ control_center_next_gen_ldap_user }}:${env:IAC_SECRET_CONTROL_CENTER_NEXT_GEN_LDAP_PASSWORD}"

# Control Center Next Gen keeps its state and the metrics of its Prometheus here (about 1 GB after a few days in a
# three-broker lab, growing with the number of partitions and the retention).
control_center_next_gen_data_dir: "{{ iac_data_dir }}/control-center"
