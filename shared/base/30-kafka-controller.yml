---
# LAYER 1 - KRaft controllers (dedicated hosts; preflight rejects controller/broker co-location,
# because cp-ansible uses the same node_id host variable for both roles)
iac_kafka_controller_heap: "-Xms2g -Xmx2g"



iac_jaas_scram_kafka: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka" password="${env:IAC_SECRET_KAFKA_BROKER_SCRAM_PASSWORD}";'
iac_jaas_plain_kafka: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka" password="${env:IAC_SECRET_KAFKA_CONTROLLER_PLAIN_PASSWORD}";'



kafka_controller_custom_properties:
  log.dirs: "{{ iac_data_dir }}/controller"
  # Mechanisms of the controllers, written out explicitly. cp-ansible derives the same values from the listeners
  # below; change both together.
  #   controller <-> controller   PLAIN          (SCRAM is impossible between KRaft controllers, 10-security.yml)
  #   inter-broker settings        SCRAM-SHA-512  (the controllers also carry the BROKER listener settings)
  sasl.mechanism.controller.protocol: PLAIN
  sasl.mechanism.inter.broker.protocol: SCRAM-SHA-512
  config.providers: env
  config.providers.env.class: org.apache.kafka.common.config.provider.EnvVarConfigProvider
  config.providers.env.param.allowlist.pattern: '^IAC_SECRET_.*'
  confluent.metadata.sasl.jaas.config: "{{ iac_jaas_scram_kafka }}"
  confluent.metrics.reporter.sasl.jaas.config: "{{ iac_jaas_scram_kafka }}"
  listener.name.broker.scram-sha-512.sasl.jaas.config: "{{ iac_jaas_scram_kafka }}"
  listener.name.controller.scram-sha-512.sasl.jaas.config: "{{ iac_jaas_scram_kafka }}"
  #listener.name.controller.plain.sasl.jaas.config: "{{ iac_jaas_plain_kafka }}"
kafka_controller_custom_client_properties:  
    config.providers: env
    config.providers.env.class: org.apache.kafka.common.config.provider.EnvVarConfigProvider
    config.providers.env.param.allowlist.pattern: '^IAC_SECRET_.*'
# merge semantics: only KAFKA_HEAP_OPTS is replaced; upstream keys (KAFKA_OPTS, LOG_DIR, ...) are kept.
kafka_controller_service_environment_overrides:
  KAFKA_HEAP_OPTS: "{{ iac_kafka_controller_heap }} {{ iac_jvm_g1_opts }}"

# ---- Listener of the controllers, written out explicitly -------------------------------------------
# cp-ansible has no kafka_controller_custom_listeners: this dictionary replaces its default completely.
# The values equal the collection default of this repository (the rendered configuration does not change);
# they are written out so that the security of the controller port is visible and can be changed in one place.
#   CONTROLLER :9093  SASL_SSL  PLAIN (controller <-> controller) + SCRAM-SHA-512 (broker -> controller)
# sasl_protocol must equal kafka_controller_sasl_protocol (10-security.yml): its FIRST value is the mechanism
# the controllers use towards each other. No client certificates (mTLS) on this listener.
kafka_controller_port: 9093
kafka_controller_listeners:
  controller:
    name: CONTROLLER
    port: "{{ kafka_controller_port }}"
    ssl_enabled: true
    ssl_mutual_auth_enabled: false
    ssl_client_authentication: none
    principal_mapping_rules: [DEFAULT]
    sasl_protocol: plain,scram

# node_id is pinned per host in hosts.yml. The upstream default of kafka_controller_quorum_voters is
# computed from the host ORDER (index + 9991), not from node_id, so it is derived from node_id here.
# Result: "<node_id>@<host>:<port>,..." in hosts.yml order.
#
# iac_kraft_colocated: small NON-PRODUCTION environments (e.g. three hosts) may run a controller and a broker
# on the same host. Both read the same node_id host variable, so node_id stays UNSET there: cp-ansible then
# numbers controllers 9991 + host index and brokers 1 + host index, and the voters follow the same rule.
# Preflight refuses the mode for the prod tier and protected environments.
iac_kraft_colocated: false
kafka_controller_quorum_voters: >-
  {{ ((range(9991, 9991 + groups['kafka_controller'] | length) | list) if iac_kraft_colocated | bool
      else (groups['kafka_controller'] | map('extract', hostvars, 'node_id') | list))
     | zip(groups['kafka_controller']) | map('join', '@')
     | product([':' ~ kafka_controller_port | default(9093)]) | map('join') | join(',') }}



# ---- KRaft controllers ------------------------------------------------------------------------------

