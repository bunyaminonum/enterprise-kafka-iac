---
# LAYER 1 - Brokers
# Frequently tuned knobs are exposed as iac_* parameters; lower layers only override the parameter.
iac_kafka_broker_heap: "-Xms6g -Xmx6g"

# merge semantics: only KAFKA_HEAP_OPTS is replaced. The upstream KAFKA_OPTS (JMX exporter agent),
# KAFKA_LOG4J_OPTS and LOG_DIR keys survive. With hash_behaviour=replace they would be lost.
kafka_broker_service_environment_overrides:
  KAFKA_HEAP_OPTS: "{{ iac_kafka_broker_heap }} {{ iac_jvm_g1_opts }}"


# JAAS lines. Only the password is a reference; user names and the rest come from the same variables cp-ansible uses.
iac_jaas_scram_kafka: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="kafka" password="${env:IAC_SECRET_KAFKA_BROKER_SCRAM_PASSWORD}";'
iac_jaas_plain_kafka: >-
  org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka" password="${env:IAC_SECRET_KAFKA_CONTROLLER_PLAIN_PASSWORD}" user_kafka="${env:IAC_SECRET_KAFKA_CONTROLLER_PLAIN_PASSWORD}"{% for u in sasl_plain_users.values() if u.principal != "kafka" %} user_{{ u.principal }}="{{ u.password }}"{% endfor %};


# The same dictionary is also populated by 10-security.yml (ldap.*). Files of one layer directory are
# merged in lexical order, so all keys end up in the final server.properties.
kafka_broker_custom_properties:
  log.dirs: "{{ iac_data_dir }}/broker"
  auto.create.topics.enable: false
  # Replication is never lowered below these values in any environment (a restart must not be an outage).
  default.replication.factor: 3
  min.insync.replicas: 2
  unclean.leader.election.enable: false
  num.partitions: 6
  confluent.balancer.enable: true
  # Mechanisms of the brokers, written out explicitly. cp-ansible derives the inter-broker value from the BROKER
  # listener below; change both together.
  #   broker <-> broker      SASL_SSL + SCRAM-SHA-512   BROKER listener :9091
  #   broker -> controller   SASL_SSL + SCRAM-SHA-512   CONTROLLER listener :9093. Not the cp-ansible default: that
  #                          would be the first value of kafka_controller_sasl_protocol (PLAIN, 10-security.yml).
  sasl.mechanism.inter.broker.protocol: SCRAM-SHA-512
  sasl.mechanism.controller.protocol: SCRAM-SHA-512
  # Confluent Server license. Registered as a required secret for the prod tier; empty elsewhere (trial mode).
  confluent.license: "{{ vault_confluent_license | default('') }}"
  config.providers: env
  config.providers.env.class: org.apache.kafka.common.config.provider.EnvVarConfigProvider
  config.providers.env.param.allowlist.pattern: '^IAC_SECRET_.*'
  ldap.java.naming.security.credentials: "${env:IAC_SECRET_LDAP_BIND_PASSWORD}"
  confluent.basic.auth.user.info: "{{ schema_registry_ldap_user }}:${env:IAC_SECRET_SCHEMA_REGISTRY_LDAP_PASSWORD}"
  kafka.rest.confluent.metadata.basic.auth.user.info: "{{ kafka_broker_ldap_user }}:${env:IAC_SECRET_KAFKA_BROKER_LDAP_PASSWORD}"
  confluent.metrics.reporter.sasl.jaas.config: "{{ iac_jaas_scram_kafka }}"
  listener.name.broker.scram-sha-512.sasl.jaas.config: "{{ iac_jaas_scram_kafka }}"
  listener.name.controller.scram-sha-512.sasl.jaas.config: "{{ iac_jaas_scram_kafka }}"
  listener.name.controller.plain.sasl.jaas.config: "{{ iac_jaas_plain_kafka }}"

# ---- Listeners of the brokers, written out explicitly ----------------------------------------------
# cp-ansible merges kafka_broker_custom_listeners key by key into its default listeners. Both entries repeat the
# collection default of this repository (the rendered configuration does not change); they are written out so
# that ports, TLS and SASL mechanisms of the brokers are visible and can be changed in one place.
#   INTERNAL :9092  SASL_SSL  OAUTHBEARER    applications, Schema Registry, Connect, REST Proxy, Control Center
#                                            (tokens issued by MDS after an LDAP login; auth_mode, 10-security.yml)
#   BROKER   :9091  SASL_SSL  SCRAM-SHA-512  broker <-> broker (inter-broker listener), never used by clients
# sasl_protocol of BROKER must equal sasl_protocol (10-security.yml). No Kerberos/GSSAPI, no client certificates.
# Every component reads the listeners from its own host context: keep them at the all level (shared/base or
# group_vars/all of an environment), never in a component group.
kafka_broker_inter_broker_listener_name: broker
kafka_broker_custom_listeners:
  internal:
    name: INTERNAL
    port: 9092
    ssl_enabled: true
    ssl_mutual_auth_enabled: false
    ssl_client_authentication: none
    principal_mapping_rules: [DEFAULT]
    sasl_protocol: OAUTH
  broker:
    name: BROKER
    port: 9091
    ssl_enabled: true
    ssl_mutual_auth_enabled: false
    ssl_client_authentication: none
    principal_mapping_rules: [DEFAULT]
    sasl_protocol: scram

# Kernel tuning of the broker hosts. cp-ansible applies these values itself (sysctl, as root).
kafka_broker_sysctl:
  vm.swappiness: 1
  vm.dirty_background_ratio: 5
  vm.dirty_ratio: 80
  vm.max_map_count: 262144



