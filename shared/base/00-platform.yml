---
# =============================================================================
# =============================================================================
# LAYER 1 - ORGANISATION BASELINE: PLATFORM            (inherited by every environment)
# Reference: cp-ansible v8.3.2 roles/variables/defaults/main.yml, roles/common/defaults/main.yml
# Rules: shared/ only contains `all`-level variables (see README). Own variables use the iac_ prefix;
# cp-ansible itself uses cp_* names (cp_cluster, cp_package, ...), so that prefix is not safe.
# =============================================================================

# ---- Version pinning --------------------------------------------------------
# Must equal the installed confluent.platform collection (enforced by playbooks/preflight.yml).
iac_cp_ansible_version: "8.3.1"
confluent_package_version: "8.3.1"
# The collection defaults to 2.2.0. Pin the Control Center Next Gen release validated for CP 8.3.
confluent_control_center_next_gen_package_version: "2.5.0"   # TODO(OD-09): confirm against the package mirror
# Confluent CLI on every host (RBAC and secret operations). Pinned: its archive name is derived from it.
confluent_cli_version: "4.72.0"
 
# ---- Installation: Confluent archives, root on the hosts ---------------------
# Ansible connects as the automation account of the environment (command line: the SSH user of the run, Tower:
# the machine credential) and becomes root on the managed hosts (ansible_become, below). Ansible needs GENERAL
# privilege escalation: it runs its modules as temporary scripts ("Privilege escalation must be general", Ansible
# documentation), a sudoers file that allows single commands is not enough. As root, cp-ansible
#   - creates the group confluent and one service account per component (cp-kafka, cp-schema-registry,
#     cp-kafka-connect, cp-kafka-rest, cp-control-center),
#   - unpacks the Confluent archive below archive_destination_path (no RPM repository: the hosts download the
#     tarballs, see "Artifact sources" below),
#   - writes the system units (confluent-kcontroller, confluent-server, confluent-schema-registry,
#     confluent-kafka-connect, confluent-kafka-rest, confluent-control-center) and applies kafka_broker_sysctl.
# Layout on every host (cp-ansible creates the directories and gives them to the service accounts):
#   /opt/confluent/confluent-<version>   binaries (archive_destination_path)
#   /opt/confluent/etc/<component>       configuration
#   /var/ssl/private                     host certificates (placed by the OS team) and keystores
#   iac_data_dir   data disk: <iac_data_dir>/controller (KRaft metadata), /broker (Kafka data),
#                  /control-center (Control Center Next Gen and its Prometheus)
#   iac_log_dir    log disk: one subdirectory per component (shared/base/20-observability.yml)
# Size (CP 8.3.1): 1.8 GB per host, 3.5 GB on the Control Center host (archives are unpacked, not kept).
# (rootless_enabled: true would install and run everything as ONE unprivileged user without sudo; not used.)
installation_method: archive
confluent_server_enabled: true
archive_destination_path: /opt/confluent
iac_data_dir: /kafka/data
iac_log_dir: /var/log/kafka

# ---- Artifact sources ---------------------------------------------------------
# Every download goes through Nexus. The hosts download the four archives themselves (the *_remote defaults of
# cp-ansible stay true), so every host needs HTTPS to iac_artifact_url and trusts its CA. The raw repository
# holds the files under exactly these names; the Confluent CLI is published upstream only without its version in
# the file name, so it is uploaded under the versioned name.
iac_nexus_url: "https://nexus.internal.net/repository"
iac_artifact_url: "{{ iac_nexus_url }}/confluent-archives"
confluent_archive_file_source: "{{ iac_artifact_url }}/confluent-{{ confluent_package_version }}.tar.gz"
confluent_archive_control_center_next_gen_file_source: "{{ iac_artifact_url }}/confluent-control-center-next-gen-{{ confluent_control_center_next_gen_package_version }}.tar.gz"
confluent_cli_archive_file_source: "{{ iac_artifact_url }}/confluent_{{ confluent_cli_version }}_linux_amd64.tar.gz"

# ---- Java --------------------------------------------------------------------
# Java 21 is installed by the OS team (java-21-openjdk-headless). custom_java_path turns the collection's Java
# installation off and becomes JAVA_HOME of every component.
custom_java_path: /usr/lib/jvm/jre-21-openjdk

# JVM options of Confluent's production guidance, shared by all JVM components (heap sizes come from the tiers).
iac_jvm_g1_opts: >-
  -XX:MetaspaceSize=96m -XX:+UseG1GC -XX:MaxGCPauseMillis=20
  -XX:InitiatingHeapOccupancyPercent=35 -XX:G1HeapRegionSize=16M
  -XX:MinMetaspaceFreeRatio=50 -XX:MaxMetaspaceFreeRatio=80

# ---- Execution behaviour -----------------------------------------------------
# Privilege escalation for the managed hosts only (not set globally in ansible.cfg, so that tasks
# delegated to the control node do not need sudo there). The SSH user is not set here: it is the automation
# account of the environment (command line: the user of the run or ansible_user in hosts.yml, Tower: the machine
# credential).
ansible_become: true
# rolling = serial provisioning (one host at a time) for hosts whose service is already running;
# cp-ansible always provisions not-yet-running (greenfield) hosts in parallel. This only works through the
# upstream playbooks (playbooks/site.yml imports confluent.platform.all).
# Upstream caveat: rolling can fail while security modes are being changed. Use
# -e deployment_strategy=parallel for such runs (inside a maintenance window).
deployment_strategy: rolling
# Environments that require an explicit confirmation: -e confirm_env=<environment>
iac_protected_envs: [preprod, production, dr]
# Never print secrets in logs or diffs (cp-ansible defaults, pinned so nobody disables them silently).
mask_sensitive_logs: true
mask_sensitive_diff: true

# ---- Support bundle ----------------------------------------------------------
# The confluent.platform.support_bundle_on_failure callback (ansible.cfg) re-runs playbooks/support_bundle.yml
# when a run fails. The callback reads its switch only from all.vars of the inventory and from -e key=value, never
# from group_vars files (docs/UPSTREAM-NOTES.md). Tower stores group_vars/all as inventory variables and hands them
# to the job as all.vars, so the value below switches the callback off in Tower only: there the bundle would be
# written into the job's execution environment container and disappear with it. On the command line the callback
# does not see this file and stays on (off: AUTO_SUPPORT_BUNDLE=false with scripts/run.sh).
# IAC_SUPPORT_BUNDLE_DIR lets CI collect the bundle into its workspace.
support_bundle_auto_collect_on_failure: false
support_bundle_output_path: "{{ lookup('ansible.builtin.env', 'IAC_SUPPORT_BUNDLE_DIR', default='~/confluent-platform-support-bundles') }}"
