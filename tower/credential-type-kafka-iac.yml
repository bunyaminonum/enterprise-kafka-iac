---
# =============================================================================
# Tower / AAP automation controller: custom credential type "Kafka IaC".
# One credential of this type per environment (e.g. "Kafka IaC - dev100"); the job templates of that environment
# use it. It injects the IAC_SECRET_* variables that shared/base/15-secrets.yml reads, so the playbooks see the same
# environment as with "set -a; . ~/.secrets/<environment>.env" on the command line (secrets.env.example).
#
# Controller UI: Administration > Credential Types > Add
#   Input configuration     the value of "inputs" below
#   Injector configuration  the value of "injectors" below
# The same keys (name, kind, inputs, injectors) are the options of the awx.awx.credential_type module.
#
# Preflight decides which secrets an environment needs (iac_required_secrets) and names every missing one, so only
# the secrets of every environment are required here. Unset optional fields are injected as empty strings, which
# preflight treats like a missing variable. Tower refuses ANSIBLE_* variables in credential injectors.
# =============================================================================
name: Kafka IaC
description: IAC_SECRET_* variables of one enterprise-kafka-iac environment (shared/base/15-secrets.yml)
kind: cloud

inputs:
  fields:
    - id: ldap_bind_password
      label: LDAP bind password
      type: string
      secret: true
      help_text: IAC_SECRET_LDAP_BIND_PASSWORD - bind account of MDS (iac_ldap_bind_dn)
    - id: mds_super_user_password
      label: MDS super user password
      type: string
      secret: true
      help_text: IAC_SECRET_MDS_SUPER_USER_PASSWORD - LDAP password of mds_super_user
    - id: kafka_broker_ldap_password
      label: Kafka broker LDAP password
      type: string
      secret: true
      help_text: IAC_SECRET_KAFKA_BROKER_LDAP_PASSWORD - LDAP password of kafka_broker_ldap_user
    - id: schema_registry_ldap_password
      label: Schema Registry LDAP password
      type: string
      secret: true
      help_text: IAC_SECRET_SCHEMA_REGISTRY_LDAP_PASSWORD - LDAP password of schema_registry_ldap_user
    - id: kafka_connect_ldap_password
      label: Kafka Connect LDAP password
      type: string
      secret: true
      help_text: IAC_SECRET_KAFKA_CONNECT_LDAP_PASSWORD - LDAP password of kafka_connect_ldap_user
    - id: kafka_rest_ldap_password
      label: REST Proxy LDAP password
      type: string
      secret: true
      help_text: IAC_SECRET_KAFKA_REST_LDAP_PASSWORD - LDAP password of kafka_rest_ldap_user
    - id: control_center_next_gen_ldap_password
      label: Control Center LDAP password
      type: string
      secret: true
      help_text: IAC_SECRET_CONTROL_CENTER_NEXT_GEN_LDAP_PASSWORD - LDAP password of control_center_next_gen_ldap_user
    - id: kafka_broker_scram_password
      label: Broker SCRAM-SHA-512 password
      type: string
      secret: true
      help_text: >-
        IAC_SECRET_KAFKA_BROKER_SCRAM_PASSWORD - letters and digits only (openssl rand -hex 24). Set once before the
        first installation and never change it without the rotation procedure.
    - id: kafka_controller_plain_password
      label: KRaft controller PLAIN password
      type: string
      secret: true
      help_text: >-
        IAC_SECRET_KAFKA_CONTROLLER_PLAIN_PASSWORD - letters and digits only (openssl rand -hex 24). Set once before
        the first installation and never change it without the rotation procedure.
    - id: oauth_superuser_client_secret
      label: OAuth super user client secret
      type: string
      secret: true
      help_text: IAC_SECRET_OAUTH_SUPERUSER_CLIENT_SECRET - only with auth_mode oauth / ldap_with_oauth
    - id: schema_registry_oauth_client_secret
      label: Schema Registry OAuth client secret
      type: string
      secret: true
      help_text: IAC_SECRET_SCHEMA_REGISTRY_OAUTH_CLIENT_SECRET - only with auth_mode oauth / ldap_with_oauth
    - id: kafka_connect_oauth_client_secret
      label: Kafka Connect OAuth client secret
      type: string
      secret: true
      help_text: IAC_SECRET_KAFKA_CONNECT_OAUTH_CLIENT_SECRET - only with auth_mode oauth / ldap_with_oauth
    - id: kafka_rest_oauth_client_secret
      label: REST Proxy OAuth client secret
      type: string
      secret: true
      help_text: IAC_SECRET_KAFKA_REST_OAUTH_CLIENT_SECRET - only with auth_mode oauth / ldap_with_oauth
    - id: control_center_oauth_client_secret
      label: Control Center OAuth client secret
      type: string
      secret: true
      help_text: IAC_SECRET_CONTROL_CENTER_OAUTH_CLIENT_SECRET - only with auth_mode oauth / ldap_with_oauth
    - id: confluent_license
      label: Confluent license
      type: string
      secret: true
      help_text: IAC_SECRET_CONFLUENT_LICENSE - required by the prod tier
    - id: password_encoder_secret
      label: Password encoder secret
      type: string
      secret: true
      help_text: IAC_SECRET_PASSWORD_ENCODER_SECRET - Cluster Linking (dr)
  required:
    - ldap_bind_password
    - mds_super_user_password
    - kafka_broker_ldap_password
    - schema_registry_ldap_password
    - kafka_connect_ldap_password
    - kafka_rest_ldap_password
    - control_center_next_gen_ldap_password
    - kafka_broker_scram_password
    - kafka_controller_plain_password

injectors:
  env:
    IAC_SECRET_LDAP_BIND_PASSWORD: "{{ ldap_bind_password }}"
    IAC_SECRET_MDS_SUPER_USER_PASSWORD: "{{ mds_super_user_password }}"
    IAC_SECRET_KAFKA_BROKER_LDAP_PASSWORD: "{{ kafka_broker_ldap_password }}"
    IAC_SECRET_SCHEMA_REGISTRY_LDAP_PASSWORD: "{{ schema_registry_ldap_password }}"
    IAC_SECRET_KAFKA_CONNECT_LDAP_PASSWORD: "{{ kafka_connect_ldap_password }}"
    IAC_SECRET_KAFKA_REST_LDAP_PASSWORD: "{{ kafka_rest_ldap_password }}"
    IAC_SECRET_CONTROL_CENTER_NEXT_GEN_LDAP_PASSWORD: "{{ control_center_next_gen_ldap_password }}"
    IAC_SECRET_KAFKA_BROKER_SCRAM_PASSWORD: "{{ kafka_broker_scram_password }}"
    IAC_SECRET_KAFKA_CONTROLLER_PLAIN_PASSWORD: "{{ kafka_controller_plain_password }}"
    IAC_SECRET_OAUTH_SUPERUSER_CLIENT_SECRET: "{{ oauth_superuser_client_secret }}"
    IAC_SECRET_SCHEMA_REGISTRY_OAUTH_CLIENT_SECRET: "{{ schema_registry_oauth_client_secret }}"
    IAC_SECRET_KAFKA_CONNECT_OAUTH_CLIENT_SECRET: "{{ kafka_connect_oauth_client_secret }}"
    IAC_SECRET_KAFKA_REST_OAUTH_CLIENT_SECRET: "{{ kafka_rest_oauth_client_secret }}"
    IAC_SECRET_CONTROL_CENTER_OAUTH_CLIENT_SECRET: "{{ control_center_oauth_client_secret }}"
    IAC_SECRET_CONFLUENT_LICENSE: "{{ confluent_license }}"
    IAC_SECRET_PASSWORD_ENCODER_SECRET: "{{ password_encoder_secret }}"
